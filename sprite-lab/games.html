<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0e1014;--panel:#161a22;--panel2:#1d2330;--panel3:#242c3b;--text:#e9eef8;--muted:#93a0b8;--accent:#7ef0ff;--accent2:#b06cff;--border:#283142;--good:#6ee06e;--warn:#ffd36b;--bad:#ff8a8a;--gold:#c9a65a}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--accent)}
:where(button,.tab,.listItem,select):focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tab,.btn,button{transition:none}}
header{min-height:48px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;background:#0e1014f5;position:sticky;top:0;z-index:20}
header h1{font-size:14px;margin:0;font-weight:700}
.navLink{color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:12px;border:1px solid transparent}
.navLink:hover{color:var(--text);background:var(--panel)} .navLink.active{background:#1e3348;border-color:#2b4866;color:#dffaff}
select.ctrl{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px}
#gameSel{font-weight:700}
.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 48px)}
nav#tabs{border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:3px;position:sticky;top:48px;height:calc(100vh - 48px)}
.tab{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;border:1px solid transparent;background:none;text-align:left}
.tab:hover{background:var(--panel);color:var(--text)} .tab.active{background:#2f2550;border-color:#7658c8;color:#fff}
.tab .n{margin-left:auto;font-size:10px;background:var(--panel3);border-radius:999px;padding:0 6px;color:var(--muted)}
main{padding:16px 18px;min-width:0}
h2{font-size:18px;margin:0 0 4px} h3{font-size:14px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px;max-width:980px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.heroCard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;margin-bottom:12px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.statCell{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.statCell b{font-size:15px}
.iconRow{display:flex;align-items:center;gap:8px} .iconRow canvas{flex:0 0 auto}
.heroCard .btn{padding:3px 7px;font-size:11px}
.itemCard{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px}
.side2{display:grid;gap:12px;grid-template-columns:minmax(0,420px) minmax(0,1fr);margin-top:10px}
.tableWrap{overflow-x:auto;max-width:100%}
.stage canvas{max-width:100%;height:auto}
main,.card,.grid>*{min-width:0}
td{overflow-wrap:break-word}
th.cell{text-align:center}
table.mid td{vertical-align:middle}
.topTable td:first-child{width:118px;font-weight:600}
.alignTop{align-items:start}
.shotHead{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.shotHead h3{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:11px}
.pill{font-size:11px;color:#cfe9ff;background:#1e3348;border:1px solid #2b4866;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.used{background:#1d3a24;border-color:#2f6b3c;color:#c9f5d0} .pill.lab{background:#3a2a1a;border-color:#6b4f2f;color:#ffe2b8}
.stat{display:flex;align-items:center;gap:8px;padding:3px 0}
.stat canvas{flex:0 0 auto} .stat .k{color:var(--muted);flex:1} .stat .v{font-weight:700}
.counter{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.counter:hover{border-color:#43506a} .counter .big{font-size:26px;font-weight:800} .counter .lbl{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%} th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
canvas{image-rendering:pixelated;display:block}
.stage{background:#2f4a2c;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12px}
.btn:hover{border-color:#43506a} .btn.on{background:#2f2550;border-color:#7658c8;color:#fff}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--muted)}
.chip.active{background:#173a46;border-color:#2b7d91;color:#dffaff}
.search{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:220px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.shots figure{margin:0;cursor:zoom-in} .shots img{width:100%;border-radius:6px;border:1px solid var(--border);display:block;background:#000}
.shots figcaption{font-size:11px;color:var(--muted);margin-top:3px}
#lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:90vh;image-rendering:auto;border-radius:6px}
#lightbox .cap{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#ddd}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;padding:3px;border:1px solid var(--border);border-radius:6px;background:#121720}
.layer.off{opacity:.35} .layer canvas{background:#1b2230}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend span{display:flex;align-items:center;gap:5px} .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.split{display:grid;grid-template-columns:260px 1fr;gap:12px}
.listItem{padding:8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--panel2);margin-bottom:5px}
.listItem:hover{border-color:#43506a} .listItem.active{background:#2f2550;border-color:#7658c8}
.listItem .t{font-weight:700} .listItem .s{color:var(--muted);font-size:11px}
.empty{padding:24px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:3px;font-size:10px;border-radius:5px;padding:1px 6px;border:1px solid var(--border);white-space:nowrap}
.chk.pass{background:#17301d;border-color:#2f6b3c;color:#bff0c8} .chk.fail{background:#3a1a22;border-color:#a83f55;color:#ffc9d3}
.chk.warn{background:#3a331a;border-color:#a8902f;color:#ffeeb0} .chk.na{color:var(--muted)}
.checks{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.verdict{font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px}
.verdict.ok{background:#1d3a24;color:#c9f5d0} .verdict.bad{background:#3a1a22;color:#ffc9d3}
td.cell{text-align:center}
.err{color:var(--bad)}
@media (max-width:1100px){.side2{grid-template-columns:1fr}}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start} .split{grid-template-columns:1fr}
  nav#tabs{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);background:var(--bg);padding:6px}
  .tab{white-space:nowrap;padding:6px 10px} header{position:static}}
@media (max-width:600px){.heroCard{grid-template-columns:1fr} main{padding:12px 10px} h2{font-size:16px} .counter .big{font-size:20px} .card{padding:10px} th,td{padding:5px 6px}}
</style>
</head>
<body>
<header>
  <h1>Studio</h1>
  <a class="navLink" href="viewer.html">Sprite Lab</a>
  <a class="navLink active" href="games.html">Game</a>
  <select id="gameSel" class="ctrl"></select>
  <span id="gameVer" class="pill"></span>
  <span id="dataBuilt" class="muted small" style="margin-left:auto"></span>
  </header>
<div class="layout">
  <nav id="tabs"></nav>
  <main id="main"><div class="empty">Đang tải… (chạy <code>sprite-lab/serve-viewer.sh</code>)</div></main>
</div>
<div id="lightbox"><img alt=""><div class="cap"></div></div>

<script>
/* Game dashboard: everything the game really has, read from games-manifest.json
   (built from the game's own data files and sprites), to look at and discuss. */
const $=id=>document.getElementById(id);
function el(tag,attrs,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e[k]=v; else if(k==='style') e.style.cssText=v; else e.setAttribute(k,v); }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c); }
  return e;}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');

let games=[],game=null,labSprites=[],tab='overview',dataBuilt='';
const TABS=[
  ['overview','Tổng quan'],['rules','Luật gameplay'],['ui','Giao diện'],['map','Bản đồ & ải'],['meta','Nhiệm vụ & Gacha'],
  ['heroes','Nhân vật'],['monsters','Quái vật'],['skills','Kỹ năng'],['items','Vật phẩm'],['effects','Hiệu ứng'],['scenario','Kịch bản']];

/* ---------- sprites: load a strip + meta, draw an animation at time t ---------- */
const imgCache={};
function loadImg(url){ if(!imgCache[url]) imgCache[url]=new Promise(res=>{const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=url;}); return imgCache[url]; }
class Sheet{
  constructor(meta,img,name){this.meta=meta;this.img=img;this.name=name;
    this.fs=meta.frame_size||[32,32]; this.anchor=meta.anchor||[this.fs[0]/2,this.fs[1]/2];
    this.anims=(meta.animations&&meta.animations.length)?meta.animations:[{name:'default',start:0,frames:meta.frames||1,fps:meta.fps||8,loop:meta.loop!==false}];}
  anim(n){return this.anims.find(a=>a.name===n)||this.anims[0];}
  has(n){return this.anims.some(a=>a.name===n);}
  ms(a,i){return a.durations_ms?a.durations_ms[i]:1000/Math.max(1,a.fps||8);}
  duration(n){const a=this.anim(n);let s=0;for(let i=0;i<a.frames;i++) s+=this.ms(a,i);return s/1000;}
  frame(n,t){const a=this.anim(n);let ms=t*1000;const total=this.duration(n)*1000;
    if(a.loop!==false) ms=((ms%total)+total)%total; else ms=Math.min(ms,total-0.001);
    for(let i=0;i<a.frames;i++){const f=this.ms(a,i); if(ms<f) return (a.start||0)+i; ms-=f;} return (a.start||0)+a.frames-1;}
  drawIndex(g,idx,x,y,sc,flip,alpha,src){const [w,h]=this.fs; const ax=flip?w-this.anchor[0]:this.anchor[0];
    sc*=this.meta.px_scale||1;   // double-density sprites (icefx) draw at the same size as in the game
    g.save(); if(alpha!=null) g.globalAlpha=alpha; g.imageSmoothingEnabled=false;
    const dx=Math.round(x-ax*sc), dy=Math.round(y-this.anchor[1]*sc);
    if(flip){g.translate(dx+w*sc,dy); g.scale(-1,1); g.drawImage(src||this.img,idx*w,0,w,h,0,0,w*sc,h*sc);}
    else g.drawImage(src||this.img,idx*w,0,w,h,dx,dy,w*sc,h*sc);
    g.restore();}
  draw(g,n,t,x,y,sc,flip,alpha){ if(this.img) this.drawIndex(g,this.frame(n,t),x,y,sc,flip,alpha); }
}
const sheetCache={};
async function sheetOf(info){ if(!info) return null; const key=info.strip;
  if(!sheetCache[key]) sheetCache[key]=loadImg(info.strip).then(img=>img?new Sheet(info.meta,img,info.name):null);
  return sheetCache[key]; }
function gameSprite(name){ return (game.sprites||[]).find(s=>s.name===name)||null; }
function labSprite(name){ const s=labSprites.find(x=>x.name===name); return s?{name:s.name,meta:s.meta,strip:s.strip}:null; }
function anySprite(name){ return gameSprite(name)||labSprite(name); }

/* ---------- one animation loop for every live canvas on the page ---------- */
let painters=[],t0=performance.now();
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function addPainter(f){painters.push(f);}
function loop(){ const t=reduceMotion?0:(performance.now()-t0)/1000; painters=painters.filter(p=>p.c.isConnected);
  for(const p of painters){ try{ p.f(t); }catch(e){ console.error(e); } } requestAnimationFrame(loop);}
requestAnimationFrame(loop);
function liveCanvas(w,h,f){const c=el('canvas',{width:w,height:h}); const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  addPainter({c,f:t=>f(g,t,c)}); return c;}

/* ---------- icons (the game's own ui-icons sprite) ---------- */
let iconSheet=null, gearIcons=null, cardIcons=null;   // ui-icons (16 px), gear-icons (24 px items), card-icons (24 px cards, read first like the game)
let vecIcons={};   // stat card id -> loaded Image of its svg (game card_icons.json; the game draws these, user 2026-11-21)
function iconCanvas(name,sc){sc=sc||1; const W=16*sc, c=el('canvas',{width:W,height:W}); const g=c.getContext('2d');
  if(vecIcons[name]){ g.drawImage(vecIcons[name],0,0,W,W); return c; }
  if(cardIcons&&cardIcons.has(name)){ const k=Math.max(1,Math.floor(W/24)); cardIcons.draw(g,name,0,W/2,W/2,k); }
  else if(iconSheet&&iconSheet.has(name)) iconSheet.draw(g,name,0,8*sc,8*sc,sc); return c;}
const RARITY_VI={common:'Thường',rare:'Hiếm',epic:'Sử thi',legendary:'Huyền thoại'};
const RARITY_COL={common:'#e8e2d0',rare:'#6fb7ff',epic:'#c38df5',legendary:'#f2b64a'};
// gem (ui-icons rarity_*) + tier name in its colour (design/card-rarity.md)
function rarityBadge(r){r=r||'common'; return el('span',{class:'iconRow',style:'display:inline-flex;gap:4px;color:'+(RARITY_COL[r]||'#ccc')},iconCanvas('rarity_'+r,1),RARITY_VI[r]||r);}
function statRow(icon,label,value){return el('div',{class:'stat'},iconCanvas(icon,2),el('span',{class:'k'},label),el('span',{class:'v'},value));}

/* ---------- boot ---------- */
async function init(){
  try{
    const [gm,sm]=await Promise.all([fetch('games-manifest.json',{cache:'no-store'}),fetch('sprites-manifest.json',{cache:'no-store'})]);
    const manifest=await gm.json(); games=manifest.games||[]; dataBuilt=manifest.built||'';
    labSprites=sm.ok?((await sm.json()).sprites||[]):[];
  }catch(e){ $('main').innerHTML='<div class="empty err">Không tải được dữ liệu: '+esc(e.message)+'<br>Chạy <code>sprite-lab/serve-viewer.sh</code> rồi mở <code>http://localhost:8765/sprite-lab/games.html</code>.</div>'; return; }
  $('dataBuilt').textContent=dataBuilt?('Dữ liệu web: '+dataBuilt):'';
  const sel=$('gameSel'); sel.innerHTML='';
  games.forEach(g=>sel.appendChild(el('option',{value:g.slug},g.name)));
  const [slug,t]=decodeURIComponent(location.hash.slice(1)).split('/');
  const first=games.find(g=>g.slug===slug)||games.find(g=>g.skills.length)||games[0];
  if(TABS.some(x=>x[0]===t)) tab=t;
  sel.onchange=()=>selectGame(games.find(g=>g.slug===sel.value));
  if(first) selectGame(first); else $('main').innerHTML='<div class="empty">Chưa có game nào.</div>';
}
async function selectGame(g){
  game=g; $('gameSel').value=g.slug; $('gameVer').textContent='v'+g.version;
  const ic=gameSprite('ui-icons'); iconSheet=ic?await sheetOf(ic):null;
  const gi=gameSprite('gear-icons'); gearIcons=gi?await sheetOf(gi):null;
  const ci=gameSprite('card-icons'); cardIcons=ci?await sheetOf(ci):null;
  vecIcons={}; await Promise.all(Object.entries(g.vector_icons||{}).map(([k,u])=>new Promise(ok=>{
    const im=new Image(); im.onload=()=>{vecIcons[k]=im; ok();}; im.onerror=()=>ok(); im.src=u; })));
  renderTabs(); render();
}
function renderTabs(){
  const n={overview:'',rules:(game.rules&&game.rules.rules||[]).length,ui:game.ui.shots.length,map:(game.progression&&game.progression.count)||game.stages.length,
    meta:((game.missions||{}).pool||[]).length,heroes:game.heroes.length,
    monsters:game.monsters.length,skills:game.skills.length,items:(game.items.pickups.length+(game.items.buffs||[]).length+game.items.equipment.length),effects:(game.statuses||[]).length,
    scenario:(game.docs||[]).length};
  const nav=$('tabs'); nav.innerHTML='';
  TABS.forEach(([id,label])=>{const b=el('button',{class:'tab'+(tab===id?' active':'')},label,n[id]!==''?el('span',{class:'n'},n[id]):null);
    b.onclick=()=>{tab=id; renderTabs(); render();}; nav.appendChild(b);});
}
function render(){
  const keep=decodeURIComponent(location.hash.slice(1)).split('/').slice(2).join('/');
  history.replaceState(null,'','#'+game.slug+'/'+tab+(tab==='skills'&&keep?'/'+keep:'')); painters=[];
  const m=$('main'); m.innerHTML=''; ({overview,rules,ui,map,meta,heroes,monsters,skills,items,effects,scenario})[tab](m);
  wrapTables(m);
}

function wrapTables(root){ root.querySelectorAll('table').forEach(t=>{ if(t.parentElement.classList.contains('tableWrap')) return;
  const w=el('div',{class:'tableWrap'}); t.replaceWith(w); w.appendChild(t); }); }
/* ---------- gameplay rules (assets/data/gameplay_rules.json) ---------- */
function ruleList(){ return (game.rules&&game.rules.rules)||[]; }
function ruleOf(id){ return ruleList().find(r=>r.id===id)||{id,title:id,severity:'should'}; }
function chip(id,res,compact){ const r=ruleOf(id); const st=res[0]==='fail'?(r.severity==='must'?'fail':'warn'):res[0];
  const mark={pass:'✓',fail:'✗',warn:'!',na:'–'}[st];
  return el('span',{class:'chk '+st,title:r.title+': '+res[1]},compact?mark:mark+' '+r.title+(st==='fail'||st==='warn'?' ('+res[1]+')':'')); }
const EFFECT_NAME={damage:'sát thương',cooldown:'hồi chiêu',area:'vùng đánh',max_hp:'máu tối đa',move_speed:'tốc độ chạy',
  magnet:'tầm hút',regen:'hồi máu/s',armor:'giáp',back_slash:'nhát chém sau'};
function effText(eff){ return Object.entries(eff).map(([k,v])=>{
  const n=k.startsWith('skill_damage.')?'sát thương chiêu':k.startsWith('skill_area.')?'vùng chiêu':(EFFECT_NAME[k]||k);
  return n+(v.mul!=null?' ×'+v.mul:' +'+v.add); }).join(', '); }
function ruleLine(check){
  if(!check) return el('div',{});
  const bad=check.fail.map(f=>ruleOf(f).title+' ('+check.results[f][1]+')'), warn=check.warn.map(f=>ruleOf(f).title+' ('+check.results[f][1]+')');
  return el('p',{class:'small',style:'margin:0 0 8px;color:'+(bad.length?'var(--bad)':warn.length?'var(--warn)':'var(--good)')},
    bad.length?'Vi phạm luật: '+bad.join('; '):'Đạt luật gameplay'+(warn.length?' · lưu ý: '+warn.join('; '):''));
}
function rules(m){
  m.appendChild(el('h2',{},'Luật gameplay'));
  m.appendChild(el('p',{class:'lead',html:'Bách Ải là game 2D sinh tồn kiểu Vampire Survivors: chỉ di chuyển, đòn tự đánh, quái tràn theo đợt. Mọi kỹ năng và hiệu ứng phải qua các luật dưới đây. Luật <b>bắt buộc</b> sai thì <code>gamekit test</code> của game fail. Nguồn: <a href="'+(game.rule_doc||'#')+'" target="_blank">design/gameplay-rules.md</a> và <code>assets/data/gameplay_rules.json</code>.'}));
  if(!ruleList().length){ m.appendChild(el('div',{class:'empty'},'Game này chưa có assets/data/gameplay_rules.json.')); return; }
  const lim=game.rules.limits||{};

const GRASS=['#2f4a2c','#33502f','#2c4629'],TUFT='#3f6136',FLOWER='#b8b06a',OUTSIDE='#1b2419',EDGE='#151c14';
const MON_COL=['#4cc9a0','#9b7bd9','#e0a33a','#e05d5d','#5db0e0','#c9e05d'];
function tileHash(x,y){ // RunGround._hash with 64-bit ints, like GDScript
  let h=(BigInt(x)*73856093n)^(BigInt(y)*19349663n); if(h<0n) h=-h; return h;}
function drawGround(g,cx,cy,sc,half,w,h){ // world (0,0) at canvas (cx,cy), sc canvas px per world px
  const T=64; g.fillStyle=OUTSIDE; g.fillRect(0,0,w,h);
  const x0=Math.floor((-cx/sc)/T)-1,x1=Math.ceil(((w-cx)/sc)/T)+1,y0=Math.floor((-cy/sc)/T)-1,y1=Math.ceil(((h-cy)/sc)/T)+1;
  for(let ty=y0;ty<y1;ty++) for(let tx=x0;tx<x1;tx++){
    const px=tx*T,py=ty*T; if(Math.abs(px+T/2)>=half||Math.abs(py+T/2)>=half) continue;
    const hh=tileHash(tx,ty); const sx=cx+px*sc,sy=cy+py*sc;
    g.fillStyle=GRASS[Number(hh%3n)]; g.fillRect(Math.floor(sx),Math.floor(sy),Math.ceil(T*sc)+1,Math.ceil(T*sc)+1);
    if(sc>=0.5){ if(hh%5n===0n){ const qx=8+Number((hh>>4n)%44n),qy=8+Number((hh>>8n)%44n); g.fillStyle=TUFT;
        g.fillRect(sx+qx*sc,sy+qy*sc,2*sc,6*sc); g.fillRect(sx+(qx+4)*sc,sy+(qy+2)*sc,2*sc,4*sc); g.fillRect(sx+(qx-4)*sc,sy+(qy+2)*sc,2*sc,4*sc);}
      else if(hh%23n===1n){ const fx=10+Number((hh>>5n)%40n),fy=10+Number((hh>>9n)%40n); g.fillStyle=FLOWER; g.fillRect(sx+fx*sc,sy+fy*sc,4*sc,4*sc);} }
  }
  g.strokeStyle=EDGE; g.lineWidth=Math.max(2,6*sc); g.strokeRect(cx-half*sc,cy-half*sc,half*2*sc,half*2*sc);

function outlineFrames(src,fw,fh,color){ // same rule as spritekit/SpriteSheet.outline_frames
  const w=src.width,h=src.height,sg=src.getContext('2d'),s=sg.getImageData(0,0,w,h).data;
  const out=document.createElement('canvas'); out.width=w; out.height=h; const og=out.getContext('2d'); const o=og.createImageData(w,h); const d=o.data;
  const cr=parseInt(color.slice(1,3),16),cg=parseInt(color.slice(3,5),16),cb=parseInt(color.slice(5,7),16);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4, fx0=Math.floor(x/fw)*fw; let ba=0;
    for(let dy=-1;dy<=1;dy++){const yy=y+dy; if(yy<0||yy>=h) continue; for(let dx=-1;dx<=1;dx++){const xx=x+dx; if(xx<fx0||xx>=fx0+fw||xx>=w) continue; ba=Math.max(ba,s[(yy*w+xx)*4+3]);}}
    const sa=s[i+3]; if(sa===255||ba===0){d[i]=s[i];d[i+1]=s[i+1];d[i+2]=s[i+2];d[i+3]=sa;continue;}
    const sf=sa/255,bf=ba/255,oa=sf+bf*(1-sf); d[i]=(s[i]*sf+cr*bf*(1-sf))/oa; d[i+1]=(s[i+1]*sf+cg*bf*(1-sf))/oa; d[i+2]=(s[i+2]*sf+cb*bf*(1-sf))/oa; d[i+3]=oa*255;}
  og.putImageData(o,0,0); return out;}
async function composeLayers(info,enabled){
  const imgs=await Promise.all(info.meta.layers.map(n=>enabled[n]?loadImg(info.layers[n]):null));
  const first=imgs.find(Boolean); if(!first) return null;
  const c=document.createElement('canvas'); c.width=first.width; c.height=first.height; const g=c.getContext('2d');
  imgs.forEach(im=>{ if(im) g.drawImage(im,0,0); });
  return outlineFrames(c,info.meta.frame_size[0],info.meta.frame_size[1],info.meta.outline||'#1b1726');}

const ITEM_ICON={shield:'item_shield',low_hp_buff:'item_low_hp',hit_buff:'item_hit_buff',

function itemEffects(m){

  list.forEach(({it,buff})=>{
    const sp=buff?null:it.special, kind=buff?'aura':String(sp.kind||'');
    const R=Math.max(30,Number(buff?60:(sp.radius||120)));
    const title=buff?(it.name+' · hào quang'):(sp.name||it.name);
    const cadence=buff?('Khi nhặt, giữ '+Number(it.duration||0)+' giây'):
      (sp.every?'Mỗi '+sp.every+' giây':sp.cooldown?'Kích hoạt, nghỉ '+sp.cooldown+' giây':
       sp.every_kills?'Mỗi '+sp.every_kills+' quái hạ':sp.threshold?'Khi máu dưới '+Math.round(sp.threshold*100)+'%':'Một lần mỗi trận');
    // the sprites run.gd actually draws for this special (see trigger_special / _ring_fx)
    let auraInfo=buff?it.aura:null, auraBackInfo=buff?it.aura_back:null, auraFront=!(buff&&it.aura_layer==='back'), breakInfo=buff?it.break_sprite:null;
    if(!buff&&sp.buff){ const all=(game.items.buffs||[]).concat(game.items.special_buffs||[]);
      const bi=all.find(x=>x.id===sp.buff);
      if(bi){ auraInfo=bi.aura||null; auraBackInfo=bi.aura_back||null; auraFront=(bi.aura_layer||'front')!=='back';
        breakInfo=bi.break_sprite||null; } }
    const ring=!buff&&['pulse','freeze_nova','retaliate'].includes(kind);
    const ringSprite=ring?anySprite((sp&&sp.fx)||'stomp-i'):null;
    let ringScale=0;   // world px per art px - the sprite's TRUE scale, never shrunk
    const status=!buff?({chain_shock:'shock',burn_aura:'burn',freeze_nova:'freeze'}[kind]||null):null;
    const heroInfo=(game.heroes.find(h=>h.id===it.class)||game.heroes[0]||{}).sprite;
    const sh={};
    [['hero',heroInfo],['dummy',dummy&&dummy.sprite],['aura',auraInfo],['auraBack',auraBackInfo],
     ['wardBreak',breakInfo],
     ['ring',ringSprite],['proc',!ring&&sp&&sp.fx?anySprite(sp.fx):null],
     ['status',status?anySprite('status-'+status):null],
     ['scorch',kind==='burn_aura'?anySprite('scorch'):null]]
      .forEach(([k,info])=>{ if(info) sheetOf(info).then(x=>{sh[k]=x;}); });
    // Rule (user 2026-11-19): scale the VIEW, not the effect. The ring keeps its
    // real scale (reach / its own hitbox); zoom the camera out until its whole
    // frame fits the card, so hero, wave and reach stay in proportion.
    const W=520,H=360;
    let Z=Math.min(1,150/R);
    if(ringSprite){
      const rh=ringSprite.meta.animations[0]&&ringSprite.meta.animations[0].hitbox;
      const r1=(rh&&rh.radius?rh.radius:25)*(ringSprite.meta.px_scale||1);
      ringScale=R/Math.max(1,r1);
      Z=Math.min(Z,(W-24)/Math.max(1,ringSprite.meta.frame_size[0]*ringScale),

      if(visual) drawHb(g,{shape:'circle',radius:R},hx,hy,1,active);
      if(sh.scorch) sh.scorch.draw(g,'loop',t,dx,hy,1);
      if(sh.auraBack) sh.auraBack.draw(g,'loop',t,hx,hy,2);
      if(sh.aura&&!auraFront) sh.aura.draw(g,'loop',t,hx,hy,2);
      if(sh.hero) sh.hero.draw(g,'idle',t,hx,hy,2);
      if(sh.wardBreak){   // Bàn thạch: slabs rise -> shell -> shatter, then repeat
        if(u<0.45) sh.aura.draw(g,'form',u,hx,hy,2);
        else if(u<1.35) sh.aura.draw(g,'loop',u-0.45,hx,hy,2);

      } else if(sh.aura&&auraFront) sh.aura.draw(g,'loop',t,hx,hy,2);
      if(sh.dummy){
        const dsc=Math.max(1.6,(dummy.stats&&dummy.stats.scale)||2);
        sh.dummy.draw(g,'move',t,dx,hy,dsc,true);
        if(sh.status&&on){

        const ra=sh.ring.has('shock')?'shock':'burst';

      }
      if(sh.proc&&u<1.2) sh.proc.draw(g,'cast',u,hx,hy,2);   // one-shot item proc
      if(!visual){ g.setTransform(1,0,0,1,0,0); g.fillStyle='#e9eef8'; g.font='12px system-ui';
        g.textAlign='center'; g.fillText('Không có hiệu ứng hình ảnh riêng',W/2,H-12); }
    });

    const ic=iconCanvas(iconName,2); ic.setAttribute('aria-hidden','true');   // the title names the skill

    const card=el('div',{class:'card'},el('div',{class:'iconRow'},ic,
      el('div',{},el('b',{},title),el('div',{class:'muted small'},cadence),
        buff?'':el('div',{class:'small'},rarityBadge(it.rarity),' · mốc cấp '+(it.milestone||'?')+' · '+((game.heroes.find(h=>h.id===it.class)||{}).name||it.class)),
        buff?'':el('div',{class:'muted small'},it.desc))));

    const lands=hb&&hitTest(hb,hcx,hcy,target.x,target.y,hs,sb.radius*ssc);

    return {fx,hero,sl,kind,anim,sc,hs,hb,lead,dur,a0,a1,hits,fxAt,hcx,hcy,slFeet,target,ssc,sb,hc,period:lead+dur+0.8};
  }
  // wave: the effect flies right at its speed and hits the dummy on the way;
  // active (dash): the hero dashes right with its dash animation and slashes the dummy
  function moveScene(lv,fx,hero,sl,how){
    const dash=how==='active', shot=how==='projectile', time=Number(s.params.time||0.18), speed=Number(s.params.speed||300);
    const fly=shot?'fly_right':'sweep_right';
    const travel=dash?Number(s.params.distance||130):shot?Math.min(speed*Number(s.params.duration||1),260):speed*fx.duration(fly);
    setView(); fitView(fx,lv);
    FEET={x:60,y:VH/2+24};
    const hb0=hero.meta.body, hc={x:FEET.x+(hb0?(hb0.center[0]-hero.anchor[0])*2:0),y:FEET.y+(hb0?(hb0.center[1]-hero.anchor[1])*2:-26)};
    const ssc=dummy.stats.scale||2, sb=sl.meta.body||{center:sl.anchor,radius:8};
    const dist=travel*0.6, target={x:hc.x+dist,y:hc.y};
    const slFeet={x:target.x-(sb.center[0]-sl.anchor[0])*ssc,y:target.y-(sb.center[1]-sl.anchor[1])*ssc};
    const hitAt=dash?time*0.5:dist/speed;
    // the hit's explosion: the level's impact sprite (impact_tiers) like the game, else the shot's own
    const boom=lv.impact&&sheets[lv.impact]?sheets[lv.impact]:(fx.has('impact')?fx:null);
    const lead=0.3, dur=dash?time+0.35:shot?hitAt+(boom?boom.duration('impact'):0.2):fx.duration(fly);
    return {fx,boom,hero,sl,kind:dash?'dash':shot?'shot':'wave',anim:dash?'dash':fly,sc:2*lv.size,hb:null,lead,dur,a0:hitAt,a1:hitAt+0.1,
      hits:[lead+hitAt],fxAt:{x:hc.x,y:hc.y},hcx:hc.x,hcy:hc.y,slFeet,target,ssc,sb,hc,period:lead+dur+0.8,time,speed,travel};
  }
  hitB.onclick=()=>{ const sc=scene(s.levels[level-1]||s.levels[0]); if(!sc||!sc.hits.length) return false;
    clock=sc.hits[0]+0.04; paused=true; playB.textContent='▶ Phát'; playB.classList.remove('on'); return true; };
  // #<game>/skills/<skill>/hit/<level> opens this demo frozen on the hit
  const hashBits=decodeURIComponent(location.hash.slice(1)).split('/');
  if(hashBits[2]===s.id&&hashBits[3]==='hit'){ if(hashBits[4]){ level=Number(hashBits[4])||1; lvSel.value=level; }
    const tryHit=()=>{ if(!hitB.onclick()) setTimeout(tryHit,100); }; tryHit(); }
  const cv=liveCanvas(W,H,(g)=>{
    const now=performance.now(); if(!paused) clock+=(now-last)/1000*speed; last=now;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H);
    const lv=s.levels[level-1]||s.levels[0]; const sc=scene(lv);
    if(!sc){ g.fillStyle='#ffd36b'; g.font='13px system-ui'; g.fillText('Đang tải sprite…',12,20); return; }
    g.imageSmoothingEnabled=false; g.setTransform(Z,0,0,Z,0,0);
    drawGround(g,FEET.x,FEET.y,1,1e9,VW,VH);
    if(Z<2){ g.setTransform(1,0,0,1,0,0); g.fillStyle='rgba(0,0,0,0)'; g.setTransform(Z,0,0,Z,0,0); }
    const u=clock%sc.period, et=u-sc.lead, hp0=Number(dummy.stats.hp||10);
    const done=sc.hits.filter(h=>h<=u), hp=Math.max(0,hp0-done.length*lv.damage), lastHit=done.length?done[done.length-1]:-9;
    const lethal=hp<=0;
    // the dummy never dies or fades: red flash on each hit, hp bar from the first hit, full hp next loop
    const flash=u-lastHit<0.12;
    if(flash) drawTint(sc.sl,g,'hurt',u-lastHit,sc.slFeet.x,sc.slFeet.y,sc.ssc,true,'rgba(255,60,60,.55)');
    else sc.sl.draw(g,'move',u*0.6,sc.slFeet.x,sc.slFeet.y,sc.ssc,true);
    if(done.length){ const r=sc.sb.radius*sc.ssc, w=Math.max(16,r*2), top={x:Math.round(sc.target.x-w/2),y:Math.round(sc.target.y-r-8)};
      g.fillStyle='#1a0d14'; g.fillRect(top.x-1,top.y-1,w+2,5); g.fillStyle='#e6404d'; g.fillRect(top.x,top.y,Math.round(w*hp/hp0),3); }
    if(underHero&&sc.kind!=='dash'&&sc.kind!=='shot'&&et>=0&&et<sc.dur){
      const at=sc.kind==='orbit'?et%sc.fx.duration(sc.anim):et;
      sc.fx.draw(g,sc.anim,at,sc.fxAt.x,sc.fxAt.y,sc.sc);   // ring/ground wave behind the hero
    }
    if(sc.kind==='dash'){
      const k=Math.max(0,Math.min(1,et/sc.time)), x=FEET.x+sc.travel*k;
      if(et>=0&&et<sc.dur){ for(let j=1;j<4;j++) drawTint(sc.hero,g,'dash',et,FEET.x+(x-FEET.x)*j/4,FEET.y,2,false,'rgba(165,215,255,'+(0.18*j)+')');
        sc.hero.draw(g,'dash',et,x,FEET.y,2,false); }
      else sc.hero.draw(g,'idle',u,et>=sc.dur?FEET.x+sc.travel:FEET.x,FEET.y,2,false);
    } else sc.hero.draw(g,'idle',u,FEET.x,FEET.y,2,false);
    if(sc.kind==='wave'&&et>=0&&et<sc.dur){ sc.fx.draw(g,sc.anim,et,sc.fxAt.x+sc.speed*et,sc.fxAt.y,sc.sc); }
    else if(sc.kind==='shot'&&et>=0&&et<sc.dur){
      if(et<sc.a0) sc.fx.draw(g,sc.anim,et%sc.fx.duration(sc.anim),sc.fxAt.x+sc.speed*et,sc.fxAt.y,sc.sc);   // flying
      else if(sc.boom) sc.boom.draw(g,'impact',et-sc.a0,sc.target.x,sc.target.y,sc.sc); }         // hit
    else if(sc.kind!=='dash'&&sc.kind!=='shot'){
      const active=sc.kind==='orbit'||(et>=sc.a0&&et<sc.a1);
      if(showHb&&sc.hb) drawHb(g,sc.hb,sc.hcx,sc.hcy,sc.hs||sc.sc,true);
      if(showHb){ g.strokeStyle='rgba(110,255,140,.8)'; g.lineWidth=1.5; g.beginPath(); g.arc(sc.target.x,sc.target.y,sc.sb.radius*sc.ssc,0,Math.PI*2); g.stroke(); }
      if(!underHero&&et>=0&&et<sc.dur){ const at=sc.kind==='orbit'?et%sc.fx.duration(sc.anim):et;
        sc.fx.draw(g,sc.anim,at,sc.fxAt.x,sc.fxAt.y,sc.sc); } }
    // damage numbers like the game: rise and fade over 0.7 s
    done.forEach((h,i)=>{ const k=(u-h)/0.7; if(k<0||k>1) return; g.save();
      // ~18 px on screen at any zoom
      g.font='bold '+Math.round(18/Z)+'px system-ui'; g.textAlign='center'; g.lineWidth=5/Z; g.strokeStyle='#1a0d14';
      const y=sc.target.y-sc.sb.radius*sc.ssc-10-k*20+(i%2)*4;
      g.strokeText(String(Math.round(lv.damage)),sc.target.x,y); g.fillStyle='#fff0a0'; g.fillText(String(Math.round(lv.damage)),sc.target.x,y); g.restore(); });
    const hitNow=done.length&&u-lastHit<0.3;
    g.setTransform(1,0,0,1,0,0);
    g.font='12px system-ui'; g.textAlign='left'; g.fillStyle='#e9eef8';
    g.fillText('×'+Z.toFixed(2).replace(/\.?0+$/,'')+' · Cấp '+lv.level+' · '+lv.sprite+' · '+({melee:'chém gần',orbit:'xoáy quanh người',cast:'bắn ra '+(s.params.cast_range||0)+' px',self:'quanh người',wave:'bay '+(s.params.speed||0)+' px/s',shot:'đạn bay '+(s.params.speed||0)+' px/s'+(s.params.explode?', nổ':'')+(s.params.pierce?', xuyên':''),dash:'lướt '+(s.params.distance||0)+' px (Space)'})[sc.kind]+' · sát thương '+lv.damage+' · slime '+hp0+' máu',10,18);
    if(!sc.hits.length){ g.fillStyle='#ff8a8a'; g.fillText('Không trúng hình nhân ở vị trí này',10,36); }
    if(hitNow){ g.font='bold 22px system-ui'; g.fillStyle='#ffd36b'; g.textAlign='center'; g.fillText(lethal?'HẠ!':'TRÚNG!',W/2,40); }
  });
  cv.style.cssText='width:100%;height:auto'; card.appendChild(el('div',{class:'stage',style:'margin-top:8px;padding:0'},cv));
  // per level table
  const t=el('table',{class:'mid',style:'margin-top:10px'});
  t.appendChild(el('tr',{},el('th',{},'Cấp'),el('th',{class:'num'},'Sát thương'),el('th',{class:'num'},'Cỡ ×'),el('th',{class:'num'},'Hồi chiêu'),el('th',{},'Sprite'),el('th',{},'Hiệu ứng nâng cấp')));
  const rows=[];
  s.levels.forEach(l=>{ const thumb=el('canvas',{width:32,height:32});
    const info=anySprite(l.sprite); if(info) sheetOf(info).then(sh=>{ if(!sh) return; const g=thumb.getContext('2d'); g.imageSmoothingEnabled=false;
      const a=sh.anim(effectAnim(sh)); const idx=(a.start||0)+Math.floor(a.frames/2); const fs=sh.fs; const k=32/Math.max(fs[0],fs[1]); g.drawImage(sh.img,idx*fs[0],0,fs[0],fs[1],0,0,fs[0]*k,fs[1]*k);});
    const r=el('tr',{},el('td',{},el('b',{},'Cấp '+l.level)),el('td',{class:'num'},l.damage),el('td',{class:'num'},l.size),el('td',{class:'num'},l.cooldown+' s'),
      el('td',{},el('div',{class:'row'},thumb,el('span',{class:'small'},l.sprite))),
      el('td',{class:'small muted'},effText(l.effects),
        ...(l.statuses||[]).map(e=>el('div',{class:'small',style:'color:#ffb08a'},'· '+(((game.statuses||[]).find(x=>x.id===e.status)||{}).name||e.status)+(e.time?' '+e.time+' s':'')))));
    r.style.cursor='pointer'; r.onclick=()=>{lvSel.value=l.level; lvSel.onchange();}; rows.push(r); t.appendChild(r);});
  const markRow=()=>rows.forEach((r,i)=>r.style.background=i===level-1?'#2f2550':'');
  markRow(); card.appendChild(t);
  pane.appendChild(card);
}

/* ---------- 7. effects: status effects on characters (buff / debuff) ---------- */
function effects(m){
  m.appendChild(el('h2',{},'Hiệu ứng'));
  m.appendChild(el('p',{class:'lead'},'Hiệu ứng hiện trực tiếp lên người (buff / debuff): mô tả ngắn và sát thương tính theo sát thương của nhân vật.'));
  if(!(game.statuses||[]).length){ m.appendChild(el('div',{class:'card empty'},'Game chưa có hiệu ứng trạng thái.')); return; }
  // auras are made on the hero's frame and feet anchor: draw them with the hero,
  // "back" ones behind it, "front" ones over it, like the game does
  const c=el('div',{class:'card'},el('h3',{},'Buff'));
  const grid=el('div',{class:'grid g3'});
  const heroInfo=(game.heroes[0]||{}).sprite; let hero=null; if(heroInfo) sheetOf(heroInfo).then(x=>{hero=x;});
  const sheets={}; game.statuses.forEach(st=>{ if(st.sprite) sheetOf(st.sprite).then(x=>{sheets[st.id]=x;}); });
  const card=(title,desc,facts,list)=>{
    const cv=liveCanvas(128,128,(g,t)=>{ g.clearRect(0,0,128,128); drawGround(g,64,64,1,1e9,128,128);
      const layer=L=>list.filter(st=>st.layer===L).forEach(st=>{ const sh=sheets[st.id]; if(!sh) return;
        const a=sh.anims.find(x=>x.name==='loop')||sh.anims[0]; sh.draw(g,a.name,t,64,112,2); });
      layer('back'); if(hero) hero.draw(g,'idle',t,64,112,2); layer('front'); });
    grid.appendChild(el('div',{class:'itemCard'},el('div',{class:'stage',style:'padding:0;flex:0 0 128px'},cv),
      el('div',{},el('b',{},title),el('div',{class:'small muted',style:'margin:2px 0 4px'},desc),
        ...(facts||[]).map(f=>el('div',{class:'small'},'· '+f))))); };
  const buffs=game.statuses.filter(st=>st.kind!=='debuff'), debuffs=game.statuses.filter(st=>st.kind==='debuff');
  buffs.forEach(st=>card(st.name,st.desc,st.facts,[st]));
  c.appendChild(grid); m.appendChild(c);
  // debuffs: drawn on a slime dummy where the game draws them (body / head / feet), with the tint
  const d=el('div',{class:'card',style:'margin-top:12px'},el('h3',{},'Debuff lên quái'));
  const dg=el('div',{class:'grid g3'});
  const dummy=game.monsters.find(x=>x.id==='slime')||game.monsters[0]; let sl=null; if(dummy&&dummy.sprite) sheetOf(dummy.sprite).then(x=>{sl=x;});
  const tmp=document.createElement('canvas');
  debuffs.forEach(st=>{ const sh=sheets[st.id];
    const cv=liveCanvas(128,128,(g,t)=>{ g.clearRect(0,0,128,128); drawGround(g,64,64,1,1e9,128,128); if(!sl) return;
      const sc=(dummy.stats.scale||2)*1.5, fx=64, fy=96;
      if(st.tint){ const [w,h]=sl.fs; tmp.width=w*sc; tmp.height=h*sc; const cg=tmp.getContext('2d'); cg.imageSmoothingEnabled=false;
        const tt=st.id==='freeze'?0:t;   // frozen in ice: no animation
        cg.clearRect(0,0,tmp.width,tmp.height); sl.draw(cg,'move',tt,sl.anchor[0]*sc,sl.anchor[1]*sc,sc);
        cg.globalCompositeOperation='multiply'; cg.fillStyle=st.tint; cg.fillRect(0,0,tmp.width,tmp.height);
        cg.globalCompositeOperation='destination-in'; sl.draw(cg,'move',tt,sl.anchor[0]*sc,sl.anchor[1]*sc,sc); cg.globalCompositeOperation='source-over';
        g.drawImage(tmp,Math.round(fx-sl.anchor[0]*sc),Math.round(fy-sl.anchor[1]*sc)); }
      else sl.draw(g,'move',t,fx,fy,sc);
      const b=sl.meta.body||{center:sl.anchor,radius:8}, cx=fx+(b.center[0]-sl.anchor[0])*sc, cy=fy+(b.center[1]-sl.anchor[1])*sc;
      // like the game: status sprites are made for a body of radius 8 px, scaled to this body
      const at=st.at==='head'?[cx,cy-b.radius*sc]:[cx,cy];
      if(sheets[st.id]){ const a=sheets[st.id].anims[0]; sheets[st.id].draw(g,a.name,t,at[0],at[1],b.radius*sc/8); } });
    dg.appendChild(el('div',{class:'itemCard'},el('div',{class:'stage',style:'padding:0;flex:0 0 128px'},cv),
      el('div',{},el('b',{},st.name),el('div',{class:'small muted',style:'margin:2px 0 4px'},st.desc),
        ...(st.facts||[]).map(f=>el('div',{class:'small'},'· '+f))))); });
  d.appendChild(dg); m.appendChild(d);
}


/* ---------- Nhiệm vụ & Gacha: the long-term loops (missions.json, gacha.json) ---------- */
const STAT_VI={runs:'Số trận đã chơi',stage_wins:'Ải thắng',kills:'Quái hạ',elite_kills:'Tinh anh/boss hạ',
  essence:'Tinh hoa nhặt',gacha_pulls:'Lượt quay gacha',enhances:'Lần cường hoá đồ',challenge_wins:'Thử thách thắng'};
function meta(m){
  m.appendChild(el('h2',{},'Nhiệm vụ & Gacha'));
  m.appendChild(el('p',{class:'lead'},'Hai vòng lặp dài hạn: việc hằng ngày cho đá, rồi quay gacha tiêu đá để lấy trang bị. Số liệu đọc từ missions.json và gacha.json.'));
  const ms=game.missions||{}, ga=game.gacha||{};
  /* daily missions (design/missions.md) */
  const mc=el('div',{class:'card'});
  mc.appendChild(el('h3',{},'Nhiệm vụ ngày'));
  mc.appendChild(el('p',{class:'muted small'},'Mỗi ngày mỗi slot nhận '+(ms.per_day||0)+' nhiệm vụ chọn theo ngày + id slot (hai slot không trùng nhau), cố định cả ngày, đổi lúc 0 giờ. Xong cả '+(ms.per_day||0)+' thì thưởng thêm '+(ms.bonus_gems||0)+' đá.'));
  const pool=ms.pool||[];
  if(pool.length){
    const t=el('table',{});
    t.appendChild(el('tr',{},el('th',{},'Nhiệm vụ'),el('th',{},'Việc phải làm'),el('th',{},'Đếm'),el('th',{class:'num'},'Mục tiêu'),el('th',{class:'num'},'Đá')));
    pool.forEach(q=>t.appendChild(el('tr',{},el('td',{},el('b',{},q.name)),el('td',{},q.desc),el('td',{},STAT_VI[q.stat]||q.stat),
      el('td',{class:'num'},q.target),el('td',{class:'num'},q.gems))));
    mc.appendChild(t);
  } else mc.appendChild(el('div',{class:'empty small'},'Game chưa có dữ liệu nhiệm vụ.'));
  m.appendChild(mc);
  /* gacha (design/gacha.md) */
  const gc=el('div',{class:'card',style:'margin-top:12px'});
  gc.appendChild(el('h3',{},'Gacha'));
  gc.appendChild(el('p',{class:'muted small'},'Chỉ tiêu đá gacha, không mua vàng. '+(ga.cost_per_pull||0)+' đá/lượt; lượt thứ '+
    (ga.pity_at||0)+' kể từ món huyền thoại gần nhất chắc chắn ra huyền thoại (mỗi banner đếm riêng). Món trùng đổi thành vàng.'));
  const rates=ga.rates||{};
  const RATE_VI={common:'Thường',rare:'Hiếm',epic:'Sử thi',legendary:'Huyền thoại'};
  const SLOT_VI={weapon:'vũ khí',head:'mũ',chest:'áo',legs:'quần',arms:'tay',feet:'giày'};
  const rc=el('div',{class:'grid g2'});
  const rt=el('table',{});
  rt.appendChild(el('tr',{},el('th',{},'Độ hiếm'),el('th',{class:'num'},'Tỉ lệ')));
  Object.entries(rates).forEach(([k,v])=>rt.appendChild(el('tr',{},el('td',{},RATE_VI[k]||k),el('td',{class:'num'},(v*100).toFixed(0)+'%'))));
  rc.appendChild(el('div',{},el('b',{},'Tỉ lệ'),rt));
  const dup=ga.dup_gold||{};
  const dt=el('table',{});
  dt.appendChild(el('tr',{},el('th',{},'Món trùng'),el('th',{class:'num'},'Vàng')));
  Object.entries(dup).forEach(([k,v])=>dt.appendChild(el('tr',{},el('td',{},RATE_VI[k]||k),el('td',{class:'num'},v))));
  rc.appendChild(el('div',{},el('b',{},'Trùng → vàng'),dt));
  gc.appendChild(rc);
  const banners=ga.banners||[];
  if(banners.length){
    const bt=el('table',{style:'margin-top:10px'});
    bt.appendChild(el('tr',{},el('th',{},'Banner'),el('th',{},'Nội dung'),el('th',{},'Ô đồ')));
    banners.forEach(b=>bt.appendChild(el('tr',{},el('td',{},el('b',{},b.name)),el('td',{},b.desc||''),el('td',{},(b.slots||[]).map(x=>SLOT_VI[x]||x).join(', ')))));
    gc.appendChild(bt);
  }
  m.appendChild(gc);
}

/* ---------- Kịch bản: mọi tài liệu design/*.md của game (manifest "docs") ---------- */
function scenario(m){
  const docs=game.docs||[];
  m.appendChild(el('h2',{},'Kịch bản thiết kế'));
  m.appendChild(el('p',{class:'lead'},'Các tài liệu trong design/ của game; danh sách đọc thẳng từ thư mục nên tài liệu mới tự hiện. Nhấn vào một tài liệu để xem nội dung; nhấn lần nữa để thu gọn.'));
  if(!docs.length){ m.appendChild(el('div',{class:'card empty'},'Game chưa có tài liệu thiết kế nào trong design/.')); return; }
  const wrap=el('div',{class:'card'});
  docs.forEach(({path,title,group})=>{
    const body=el('pre',{class:'small',style:'white-space:pre-wrap;max-height:0;overflow:auto;margin:0;padding:0'});
    const btn=el('button',{class:'listItem',style:'display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left'},
      el('span',{},el('b',{},title),el('div',{class:'small muted'},group||'')),
      el('span',{class:'pill'},path.replace(/^design\//,'')));   // ux/... vs ...: the file name alone repeats
    btn.onclick=async ()=>{
      const open=body.style.maxHeight!=='0px' && body.style.maxHeight!=='0';
      if(open){ body.style.maxHeight='0'; body.style.padding='0'; btn.classList.remove('active'); return; }
      btn.classList.add('active');
      body.style.maxHeight='60vh'; body.style.padding='10px 12px';
      if(!body.dataset.loaded){
        try{ const r=await fetch('/games/'+game.slug+'/'+path); body.textContent=(r.ok?await r.text():('Không tải được tài liệu: '+path+' (HTTP '+r.status+')')); body.dataset.loaded='1'; }
        catch(e){ body.textContent='Lỗi tải '+path+': '+String(e); }
      }
    };
    wrap.appendChild(el('div',{},btn,body));   // full width: a 260px list column cut long titles
  });
  m.appendChild(wrap);
}
