<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trong trận: HUD, trùm, mốc cấp, nhân vật</title>
<link rel="stylesheet" href="journal.css">
<style>
#game { background: repeating-conic-gradient(#2a3a22 0% 25%, #243320 0% 50%) 0 0 / 64px 64px; }
.mob { position: absolute; width: 64px; height: 64px; }
/* paper slips pinned to the corners: light over the action */
.slip { position: absolute; background: var(--paper); border: 3px solid var(--edge); box-shadow: 0 4px 0 #0006; padding: 6px 12px; }
.slip::before { content: ""; position: absolute; top: -8px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--seal); border: 2px solid #5a0c08; }
.me { left: 16px; top: 14px; width: 330px; transform: rotate(-.8deg); }
.me b { font-weight: normal; font-size: 26px; }
.me .lv { float: right; font-size: 24px; color: var(--ink-red); }
.bar { height: 16px; border: 3px solid var(--ink); margin-top: 4px; position: relative; } .bar i { display: block; height: 100%; }
.bar span { position: absolute; inset: -4px 0 0; text-align: center; font-size: 18px; color: #fff; text-shadow: 1px 1px 0 #000; }
.xp { height: 6px; border-width: 2px; }
.clock { left: 520px; top: 12px; width: 240px; text-align: center; font-size: 30px; line-height: 1; padding: 4px 10px; transform: rotate(.6deg); white-space: nowrap; }
.clock small { font-size: 20px; color: var(--ink-soft); }
.tally { right: 16px; top: 14px; font-size: 26px; transform: rotate(1deg); display: flex; gap: 14px; }
.tally img { width: 20px; height: 20px; vertical-align: -2px; }
.skills { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; }
.skills .sk { width: 60px; height: 60px; background: var(--paper); border: 3px solid var(--ink); position: relative; display: grid; place-items: center; }
.skills .cd { position: absolute; left: 0; right: 0; bottom: 0; background: #3a2414bb; }
.skills .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; color: #fff; text-shadow: 1px 1px 0 #000; }
.ico { image-rendering: pixelated; background-repeat: no-repeat; }
.boss { left: 340px; top: 70px; width: 600px; text-align: center; transform: rotate(-.4deg); }
.boss b { font-weight: normal; font-size: 30px; color: var(--ink-red); }
.dim { position: absolute; inset: 0; background: #0b0810b8; }
.sheet { position: absolute; left: 160px; top: 60px; width: 960px; height: 600px; background: var(--paper); border: 4px solid var(--edge); box-shadow: 0 10px 0 #0008; padding: 24px 40px; transform: rotate(-.5deg); }
.sheet::after { content: ""; position: absolute; inset: 10px; border: 2px dashed #b89a6a; pointer-events: none; }
.rewards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 14px; }
.rw { height: 330px; border: 4px solid var(--ink); background: #ddcca0; padding: 12px; position: relative; }
.rw.on { outline: 5px solid var(--gold); transform: translateY(-6px); }
.rw h3 { font-weight: normal; font-size: 26px; text-align: center; margin-top: 4px; }
.rw p { font-size: 19px; line-height: 1.05; margin-top: 6px; }
.rw .stamp { position: absolute; top: 8px; right: 8px; font-size: 16px; color: #c0801a; }
.cols { display: flex; gap: 36px; margin-top: 8px; } .cols > div { flex: 1; }
.skrow { display: flex; gap: 10px; align-items: center; font-size: 22px; border-bottom: 2px dotted var(--dots); padding: 2px 0; }
</style>
</head>
<body>
<div id="game">
  <img class="mob" src="../../../games/bach-ai/assets/sprites/custom/slime/slime.png" style="left:200px;top:300px">
  <img class="mob" src="../../../games/bach-ai/assets/sprites/custom/bat/bat.png" style="left:960px;top:260px">
  <img class="mob" src="../../../games/bach-ai/assets/sprites/custom/goblin/goblin.png" style="left:880px;top:480px">
  <img class="mob" id="bossimg" src="../../../games/bach-ai/assets/sprites/custom/king-slime/king-slime.png" style="left:740px;top:300px;width:160px;height:160px;display:none">
  <img class="mob" src="../../../games/bach-ai/assets/sprites/custom/knight/knight.png" style="left:608px;top:330px;width:96px;height:96px">
  <div class="slip me"><b>Nhân vật 1</b><span class="lv">Cấp 8</span>
    <div class="bar"><i style="width:78%;background:#c0283a"></i><span>92 / 118</span></div><div class="bar xp"><i style="width:45%;background:#3a6aaa"></i></div></div>
  <div class="slip clock">02:41 <small>/ 05:00 · Ải 11</small></div>
  <div class="slip tally"><span><img src="assets/lobby/star.png"> 412</span><span><img src="assets/lobby/coin.png"> 18</span></div>
  <div class="skills" id="skills"></div>
  <div id="over"></div>
  <div class="hint" id="hint" style="left:16px"></div>
</div>
<script src="journal.js"></script>
<script>
const view = new URLSearchParams(location.search).get("view") || "hud";
let IC = {}, ICN = 0;
const $ = (id) => document.getElementById(id);
const icon = (id, px) => `<div class="ico" style="width:${px}px;height:${px}px;background-image:url(${Journal.SP}card-icons/card-icons_strip.png);background-size:${ICN * px}px ${px}px;background-position:${-(IC[id] || 0) * px}px 0"></div>`;
addEventListener("keydown", (ev) => {
  const to = { h: "hud", b: "boss", m: "milestone", c: "character" }[ev.key.toLowerCase()];
  if (to && to !== view) location.search = "?view=" + to;
  const sheet = { p: "pause", l: "levelup", w: "win", f: "lose" }[ev.key.toLowerCase()];   // the other in-run sheets
  if (sheet) location.href = "screen-run-journal.html?view=" + sheet;
});
(async () => {
  const [up, ci, cls, cfg] = await Promise.all([Journal.json("data/upgrades_knight.json"), Journal.json("sprites/custom/card-icons/card-icons.json"),
    Journal.json("data/classes.json"), Journal.json("data/run_config.json")]);
  ci.animations.forEach((a) => IC[a.name] = a.start); ICN = ci.frames;
  const U = (id) => up.upgrades.find((u) => u.id === id);
  const SK = [["blade_arc", 0, ""], ["whirlwind", 0.6, "3,8"], ["holy_column", 0.25, "1,5"], ["dash", 0, ""]];
  $("skills").innerHTML = SK.map(([id, k, t]) => `<div class="sk">${icon(id, 44)}${k ? `<div class="cd" style="height:${k * 100}%"></div><div class="t">${t}</div>` : ""}</div>`).join("");
  $("hint").textContent = "H HUD · B trùm · M mốc cấp · C nhân vật · P tạm dừng · L lên cấp · W thắng · F thua";
  if (view === "boss") {
    $("bossimg").style.display = "block";
    $("over").innerHTML = `<div class="slip boss"><b>Vua Thạch Nhầy</b> <span class="muted" style="font-size:20px">· giai đoạn 2</span>
      <div class="bar" style="height:20px"><i style="width:62%;background:#8a1a18"></i><span>4 960 / 8 000</span></div></div>`;
  } else if (view === "milestone") {
    const R = ["sp_aegis_boots", "sp_aegis_gauntlets", "sp_aegis_helm", "sp_aegis_blade"].map((id) => U(id) || { id, name: id, desc: "" }).filter(Boolean);
    Journal.list(() => R.length, (sel) => {
      $("over").innerHTML = `<div class="dim"></div><div class="sheet" style="top:110px;height:500px"><h1 style="text-align:center">Mốc cấp 10</h1>
        <div class="sub" style="text-align:center">Chọn một phần thưởng đặc biệt cho trận này</div>
        <div class="rewards">${R.map((u, i) => `<div class="rw ${i === sel ? "on" : ""}"><span class="stamp">Đặc biệt</span>
          <div style="width:88px;margin:0 auto">${icon(u.id, 88)}</div><h3>${u.name}</h3><p>${u.desc}</p></div>`).join("")}</div></div>`;
    }, () => location.search = "?view=hud", true).set(0);
  } else if (view === "character") {
    const st = cls.knight.stats, crit = cfg.crit;
    const rows = [["Máu tối đa", "118"], ["Sát thương", "20"], ["Chí mạng", Math.round((crit.chance + (st.crit_chance || 0)) * 100) + "%"],
      ["Sát thương chí mạng", Math.round((crit.mul + (st.crit_mul || 0)) * 100) + "%"], ["Hồi chiêu", "−10%"], ["Vùng đánh", "×1,04"],
      ["Tốc độ chạy", "158"], ["Giáp", "2 (−12%)"]];
    $("over").innerHTML = `<div class="dim"></div><div class="sheet"><h1>Nhân vật</h1><div class="sub">Kiếm sĩ · Cấp 8 · Nội tại: ${cls.knight.passive.name}</div>
      <div class="cols"><div>${rows.map(([a, b]) => `<div class="ledger"><span>${a}</span><span>${b}</span></div>`).join("")}</div>
      <div><div class="muted" style="font-size:22px">Chiêu thức</div>${SK.map(([id]) => U(id)).map((u) => `<div class="skrow">${icon(u.id, 32)}<span style="flex:1">${u.name}</span><span>cấp 2</span></div>`).join("")}
      <div class="muted" style="font-size:22px;margin-top:10px">Thẻ chỉ số</div><div class="skrow">${icon("sharpen", 32)}<span style="flex:1">Mài kiếm</span><span>+15%</span></div></div></div></div>`;
  }
})();
</script>
</body>
</html>
