<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lên cấp · Cuộn treo</title>
<link rel="stylesheet" href="journal.css">
<style>
/* Direction C "Cuộn treo" (an eastern take: Hades II's boon pick seen as hanging scrolls; Brotato's shop strip below):
   three narrow scrolls drop from a rod at the top over the live field, short until chosen; the chosen one unrolls
   longer, and a wooden strip along the bottom reads out every number and the full text. */
#game { background: url(assets/levelup/field.png) center / cover; }
#game::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#08070cf0 0 22%, #08070cd8 40% 74%, #08070c90); }
.rod { position: absolute; left: 250px; right: 250px; top: 28px; height: 16px; background: #5a3418; border: 3px solid #2a1408; }
.rod::before, .rod::after { content: ""; position: absolute; top: -8px; width: 26px; height: 26px; background: var(--gold); border: 3px solid #5a3418; }
.rod::before { left: -26px; } .rod::after { right: -26px; }
.hang { position: absolute; top: 44px; left: 0; width: 100%; display: flex; justify-content: center; gap: 60px; }
.scroll { position: relative; width: 210px; height: 300px; background: #efe0bc; border-left: 8px solid; border-right: 8px solid; cursor: pointer;
  transition: height 130ms ease-out; text-align: center; color: var(--ink); }
.scroll.on { height: 380px; }
.scroll::after { content: ""; position: absolute; left: -14px; right: -14px; bottom: -14px; height: 18px; background: #5a3418; border: 3px solid #2a1408; }
.scroll .tier { margin-top: 10px; font-size: 20px; }
.scroll .seal { position: relative; display: grid; place-items: center; width: 110px; height: 110px; margin: 10px auto 0; border-radius: 0;
  background: #d8c498; border: 4px solid var(--ink); box-shadow: none; }
.scroll.on .seal { outline: 4px solid var(--gold); }
.scroll .seal img { width: 88px; height: 88px; }
.scroll .name { font-size: 34px; margin-top: 10px; line-height: 1; }
.scroll .tag { font-size: 20px; color: var(--ink-soft); }
.scroll .tag .new { color: var(--ink-red); }
.scroll .k { margin-top: 10px; font-size: 22px; color: var(--ink-soft); }
.scroll .k .n { font-size: 40px; color: #2a7a3a; }
.scroll .num { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 26px; }
.pips { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
.pip { width: 18px; height: 8px; background: #c8b088; } .pip.on { background: var(--ink-soft); } .pip.new { background: var(--ink-red); }
.strip { position: absolute; left: 0; right: 0; bottom: 0; height: 196px; background: repeating-linear-gradient(0deg, #3a2414 0 6px, #42291a 6px 12px);
  border-top: 4px solid #1a0c04; color: #f3e6c8; padding: 16px 40px; display: grid; grid-template-columns: 300px 1fr 300px; gap: 30px; }
.strip h2 { font-size: 34px; font-weight: normal; color: var(--gold); line-height: 1; }
.strip .t { font-size: 20px; color: #c8b088; }
.strip .ln { display: flex; justify-content: space-between; font-size: 22px; border-bottom: 2px dotted #6a4a2a; }
.strip .up { color: #8adf8a; } .strip .mile { color: var(--gold); font-size: 20px; }
.strip .desc { font-size: 21px; line-height: 1.15; }
.strip .acts { font-size: 20px; display: flex; flex-direction: column; gap: 6px; }
.strip .acts span { border: 3px solid #6a4a2a; padding: 2px 10px; } .strip kbd { color: var(--gold); font-family: inherit; }
.lvl { position: absolute; top: 30px; left: 40px; color: var(--gold); font-size: 44px; line-height: 1; }
.lvl small { display: block; font-size: 20px; color: #c8b088; }
.scroll .seal img[style] { filter: brightness(.35) sepia(.6); }
</style>
</head>
<body>
<div id="game">
  <div class="lvl">Lên cấp 8<small id="odds"></small></div>
  <div class="rod"></div>
  <div class="hang" id="hang"></div>
  <div class="strip" id="strip"></div>
</div>
<script src="levelup-data.js"></script>
<script>
odds.innerHTML = LU.odds.map(([n, p, t]) => `<span style="color:${LU.tierCol[t]}">■</span> ${n} ${p}%`).join("<br>");
const paint = (on) => {
  hang.innerHTML = LU.cards.map((c, i) => {
    const [kn, a, b] = c.key, col = LU.tierCol[c.tier];
    return `<div class="scroll${i === on ? " on" : ""}" style="border-color:${col}" onmouseenter="go(${i})">
      <div class="tier" style="color:${col}">${c.kind} · ${LU.tierName[c.tier]}</div>
      <div class="seal">${LU.img(c)}</div><div class="name">${c.name}</div>
      <div class="tag">${c.isNew ? '<span class="new">Mới</span>' : `Cấp ${c.lv[0]} → ${c.lv[1]}`}</div>
      ${i === on ? `<div class="k">${kn}<br>${a} → <span class="n">${b}</span></div><div class="pips">${LU.pips(c)}</div>` : ""}</div>`;
  }).join("");
  const c = LU.cards[on];
  strip.innerHTML = `<div><h2>${on + 1}. ${c.name}</h2><div class="t">${c.kind} · ${LU.tierName[c.tier]}</div>${c.milestone ? `<div class="mile">★ ${c.milestone}</div>` : ""}
    ${c.lines.map(([n, a, b]) => `<div class="ln"><span>${n}</span><span>${a} → <span class="up">${b}</span></span></div>`).join("")}</div>
    <div class="desc">${c.desc}</div>
    <div class="acts"><span><kbd>← →</kbd> chọn · <kbd>Enter</kbd> lấy</span>${LU.actions.map(([k, n, x]) => `<span><kbd>${k}</kbd> ${n} ${x}</span>`).join("")}</div>`;
};
const go = LU.bind(3, paint);
</script>
</body>
</html>
