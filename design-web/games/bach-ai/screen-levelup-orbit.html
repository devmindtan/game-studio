<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lên cấp · Vòng quanh nhân vật</title>
<link rel="stylesheet" href="levelup-base.css">
<style>
/* F "Vòng quanh nhân vật": the fight stays on screen, only a spotlight around the hero; the three choices are round
   medallions on a ring above the hero (rarity = ring colour); the chosen one grows and its card opens to the side. */
.veil { background: radial-gradient(circle at 640px 345px, #0a0c1620 0 90px, #05060cd8 230px, #05060cf2 520px); }
.ring { position: absolute; left: 440px; top: 145px; width: 400px; height: 400px; border-radius: 50%; border: 2px dashed #ffd36b40; }
.title { position: absolute; top: 34px; width: 100%; text-align: center; font-size: 40px; color: #ffd36b; text-shadow: 0 0 16px #ffb02088; }
.odds { position: absolute; top: 640px; width: 100%; text-align: center; font-size: 14px; color: #a8aec4; }
.odds i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 6px 0 14px; }
.med { --c: #9aa0b0; position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; cursor: pointer;
  background: radial-gradient(#262b44, #10121c); box-shadow: 0 0 0 4px #05060a, 0 0 0 9px var(--c), 0 0 0 12px #05060a;
  display: grid; place-items: center; transition: transform 120ms cubic-bezier(.2,.9,.3,1.3), box-shadow 120ms; }
.med img { width: 84px; height: 84px; }
.med.on { transform: scale(1.22); box-shadow: 0 0 0 4px #05060a, 0 0 0 9px var(--c), 0 0 0 12px #05060a, 0 0 36px 10px var(--c); }
.med:not(.on) { filter: brightness(.7); }
.med .lab { position: absolute; top: 146px; width: 220px; left: -44px; text-align: center; font-size: 17px; font-weight: bold; white-space: nowrap; }
.med .lab .s { display: block; font-size: 13px; font-weight: normal; color: #a8aec4; }
.med .k { position: absolute; top: -12px; right: -8px; width: 30px; height: 30px; border-radius: 50%; background: #ffd36b; color: #10121c;
  font-weight: bold; display: grid; place-items: center; font-size: 16px; box-shadow: 0 0 0 3px #05060a; }
.panel { position: absolute; width: 300px; padding: 16px 18px; background: #0c0e18f0; box-shadow: 0 0 0 3px #05060a, 0 0 0 5px var(--c), 0 0 0 8px #05060a; font-size: 14px; }
.panel h2 { font-size: 26px; } .panel .tag { color: #a8aec4; margin-bottom: 8px; } .panel .tag .new { color: #ffd36b; font-weight: bold; }
.panel .big { font-size: 15px; color: #a8aec4; margin: 8px 0; } .panel .big .n { font-size: 34px; font-weight: bold; color: #7ee08a; }
.panel .ln { display: flex; justify-content: space-between; border-bottom: 1px solid #2a3048; padding: 2px 0; }
.panel .mile { color: #ffd36b; } .panel .d { margin-top: 8px; line-height: 1.35; }
.pips { display: flex; gap: 4px; margin-top: 4px; } .pip { width: 18px; height: 6px; background: #343a56; } .pip.on { background: #a8aec4; } .pip.new { background: #ffd36b; }
.keys { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 15px; color: #a8aec4; } .keys span { margin: 0 10px; }
</style>
</head>
<body>
<div id="game"><div class="veil"></div><div class="ring"></div>
  <div class="title">Lên cấp 8</div><div class="odds" id="odds"></div>
  <div id="meds"></div><div class="panel" id="panel"></div>
  <div class="keys" id="keys"></div>
</div>
<script src="levelup-data.js"></script>
<script>
// three spots on the ring's upper half (the hero stands at its centre, 640,345)
const SPOT = [[440, 262], [640, 178], [840, 262]];
odds.innerHTML = LU.odds.map(([n, p, t]) => `<i style="background:${LU.tierCol[t]}"></i>${n} ${p}%`).join("");
keys.innerHTML = [`<kbd>←</kbd> <kbd>→</kbd> chọn`, `<kbd>Enter</kbd> lấy`, ...LU.actions.map(([k, n, x]) => `<kbd>${k}</kbd> ${n} ${x}`), `<kbd>H</kbd> xem trận`]
  .map((s) => `<span>${s}</span>`).join("");
const paint = (on) => {
  meds.innerHTML = LU.cards.map((c, i) => `<div class="med${i === on ? " on" : ""}" style="--c:${LU.tierCol[c.tier]};left:${SPOT[i][0]}px;top:${SPOT[i][1]}px" onmouseenter="go(${i})">
    ${LU.img(c)}<div class="k">${i + 1}</div><div class="lab">${c.name}<span class="s">${LU.tierName[c.tier]} · ${c.isNew ? "Mới" : `Cấp ${c.lv[1]}`}</span></div></div>`).join("");
  const c = LU.cards[on], [kn, a, b] = c.key, left = on === 2 ? 50 : 930;   // the card opens on the side away from the medallion
  panel.style.cssText = `left:${left}px;top:150px;--c:${LU.tierCol[c.tier]}`;
  panel.innerHTML = `<h2>${c.name}</h2><div class="tag">${c.kind} · ${LU.tierName[c.tier]} · ${c.isNew ? '<span class="new">MỚI</span>' : `Cấp ${c.lv[0]} → ${c.lv[1]}`}</div>
    <div class="big">${kn}<br>${a} → <span class="n">${b}</span><div class="pips">${LU.pips(c)}</div></div>
    ${c.milestone ? `<div class="mile">★ ${c.milestone}</div>` : ""}${c.lines.map(([n, a, b]) => `<div class="ln"><span class="dim">${n}</span><span>${a} → <span class="up">${b}</span></span></div>`).join("")}
    <div class="d">${c.desc}</div>`;
};
const go = LU.bind(3, paint);
</script>
</body>
</html>
