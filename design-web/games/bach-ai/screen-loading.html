<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tải trận</title>
<style>
@font-face { font-family: "VT323"; src: url("../../fonts/VT323-Regular.ttf") format("truetype"); font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #140a14; font-family: "VT323", monospace; color: #f3e6c8; }
/* light on purpose (user 2026-11-26: "màn hình tải trận nhẹ"): flat colours, one sprite, no images to wait for */
#game { position: relative; width: 1280px; height: 720px; background: linear-gradient(#1a1030, #140a14 60%); }
.where { position: absolute; left: 0; right: 0; top: 230px; text-align: center; }
.where small { font-size: 26px; letter-spacing: 8px; color: #ffb070; }
.where h1 { font-family: "Noto Sans", "Open Sans", "DejaVu Sans", sans-serif; font-weight: 800; font-size: 72px; color: #fff0d0; text-shadow: 0 4px 0 #6a1a14; }
.track { position: absolute; left: 340px; top: 470px; width: 600px; height: 4px; background: repeating-linear-gradient(90deg, #8a6a4a 0 10px, transparent 10px 18px); }
.fill { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #ff7a3a; }
.runner { position: absolute; top: -78px; left: -40px; width: 96px; height: 96px; background-repeat: no-repeat; image-rendering: pixelated; }
.tip { position: absolute; left: 0; right: 0; top: 540px; text-align: center; font-size: 24px; color: #c8a890; }
</style>
</head>
<body>
<div id="game">
  <div class="where"><small id="region">RỪNG ÂM U</small><h1 id="stage">Ải 11</h1></div>
  <div class="track"><div class="fill" id="fill"></div><div class="runner" id="runner"></div></div>
  <div class="tip" id="tip"></div>
</div>
<script src="journal.js"></script>
<script>
const TIPS = ["Đứng yên một giây để Mắt ưng mở rộng tầm bắn.", "Quái mang dấu Yếu nhận thêm sát thương hệ đó.",
  "Space để lướt: không bị trúng đòn khi đang lướt.", "Mốc cấp 10 / 20 / 30 cho chọn thẻ đặc biệt."];
document.getElementById("tip").textContent = "Mẹo: " + TIPS[Math.floor(Date.now() / 1000) % TIPS.length];
(async () => {
  const m = await Journal.json("sprites/custom/knight/knight.json");   // the hero's run animation on the strip
  const run = m.animations.find((a) => a.name === "run"), W = m.frame_size[0], S = 2;
  const r = document.getElementById("runner");
  r.style.backgroundImage = `url(${Journal.SP}knight/knight_strip.png)`; r.style.backgroundSize = `${m.frames * W * S}px ${W * S}px`;
  const t0 = performance.now(), DUR = 1500;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / DUR), f = run.start + Math.floor((t - t0) / (1000 / run.fps)) % run.frames;
    r.style.backgroundPosition = `${-f * W * S}px 0`; r.style.left = (k * 600 - 48) + "px";
    document.getElementById("fill").style.width = (k * 600) + "px";
    if (k < 1) requestAnimationFrame(tick); else Journal.go("run");
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
