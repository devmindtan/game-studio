<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tiêu đề: Bìa sổ (hướng A)</title>
<style>
@font-face { font-family: "VT323"; src: url("../../fonts/VT323-Regular.ttf") format("truetype"); font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "VT323", monospace; }
img { image-rendering: pixelated; }
#game { position: relative; width: 1280px; height: 720px; overflow: hidden;
  background: repeating-linear-gradient(0deg, #3a2414 0 6px, #42291a 6px 12px); }
/* a lamp's warm light falls on the desk */
#game::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 620px 480px at 560px 340px, #ffcf7a26, transparent 70%); }
.cover { position: absolute; left: 300px; top: 44px; width: 560px; height: 632px; background: #5a1a14;
  border: 6px solid #2a0c08; box-shadow: 0 14px 0 #0009, inset 0 0 0 10px #6a2218, inset 0 0 0 14px #3a0e0a; }
.spine { position: absolute; left: 0; top: 0; bottom: 0; width: 42px; background: #3a0e0a;
  background-image: repeating-linear-gradient(0deg, transparent 0 120px, #c9a65a 120px 124px); }
.corner { position: absolute; width: 46px; height: 46px; background: #c9a65a; border: 4px solid #7a5a2a; }
.corner.tr { right: -6px; top: -6px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.corner.br { right: -6px; bottom: -6px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
.plate { position: absolute; left: 96px; top: 90px; width: 400px; padding: 26px 0 22px; text-align: center;
  border: 4px solid #c9a65a; outline: 4px solid #5a1a14; box-shadow: 0 0 0 8px #8a6a2a; }
.plate h1 { font-size: 104px; font-weight: normal; line-height: .85; color: #f2d27a; letter-spacing: 6px;
  text-shadow: 0 4px 0 #7a4a10, 0 -2px 0 #fff4b0; }
.plate p { font-size: 30px; color: #e8c574; letter-spacing: 4px; }
.emblem { position: absolute; left: 236px; top: 330px; width: 120px; height: 120px;
  border: 4px solid #c9a65a; display: grid; place-items: center; }
.emblem img { width: 132px; height: 132px; margin-top: -10px; filter: sepia(1) saturate(2.5) hue-rotate(-12deg) brightness(.9) contrast(1.2); opacity: .9; }
.clasp { position: absolute; right: -70px; top: 300px; width: 110px; height: 60px; background: #7a2418; border: 4px solid #2a0c08; }
.clasp::after { content: ""; position: absolute; left: 10px; top: 12px; width: 28px; height: 28px; background: #c9a65a; border: 4px solid #7a5a2a; }
.save { position: absolute; left: 96px; bottom: 54px; width: 400px; text-align: center; color: #e8c574; font-size: 24px; }
/* menu: bookmark ribbons out of the right edge */
.menu { position: absolute; left: 860px; top: 120px; display: flex; flex-direction: column; gap: 18px; }
.rib { position: relative; width: 300px; height: 78px; padding: 10px 26px 0 28px; font-size: 40px; color: #f3e6c8; cursor: pointer;
  clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%); transition: width .08s steps(2); }
.rib small { display: block; font-size: 20px; color: #ffe8c0cc; margin-top: -6px; }
.rib.on { width: 370px; filter: brightness(1.15); }
.rib.on::before { content: "▶"; position: absolute; left: 6px; top: 16px; font-size: 22px; color: #fff2a0; }
.hint { position: absolute; right: 30px; bottom: 16px; font-size: 22px; color: #c8a878; }
.ver { position: absolute; left: 30px; bottom: 16px; font-size: 22px; color: #a88a60; }
</style>
</head>
<body>
<div id="game">
  <div class="cover">
    <div class="spine"></div><div class="corner tr"></div><div class="corner br"></div>
    <div class="plate"><h1>BÁCH ẢI</h1><p>VƯỢT TRĂM ẢI</p></div>
    <div class="emblem"><img src="assets/title/knight.png" alt=""></div>
    <div class="save">Sổ của: Nhân vật 1 · Kiếm sĩ · Ải 10</div>
    <div class="clasp"></div>
  </div>
  <div class="menu" id="menu"></div>
  <div class="ver">Phiên bản 0.6.24</div>
  <div class="hint">↑ ↓ chọn · Enter mở sổ</div>
</div>
<script>
const M = [["Tiếp tục", "Nhân vật 1 · Kiếm sĩ · Ải 10", "#a0281c"], ["Chọn nhân vật", "", "#3a6a8a"],
  ["Cài đặt", "", "#6a8a3a"], ["Thoát", "", "#5a3a6a"]];
let sel = 0;
const menu = document.getElementById("menu");
M.forEach(([n, d, c], i) => {
  const e = document.createElement("div"); e.className = "rib"; e.style.background = c;
  e.innerHTML = n + (d ? `<small>${d}</small>` : "");
  e.onclick = () => { sel = i; draw(); };
  menu.appendChild(e);
});
function draw() { [...menu.children].forEach((e, i) => e.classList.toggle("on", i === sel)); }
addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "s") sel = (sel + 1) % M.length;
  if (ev.key === "ArrowUp" || ev.key === "w") sel = (sel + M.length - 1) % M.length;
  draw();
});
draw();
</script>
</body>
</html>
