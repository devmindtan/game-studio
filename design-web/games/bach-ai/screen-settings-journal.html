<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt (sổ hành trình)</title>
<link rel="stylesheet" href="journal.css">
<style>
.opt { display: flex; align-items: center; font-size: 26px; padding: 6px 10px; border-bottom: 2px dotted var(--dots); }
.opt span:first-child { flex: 1; }
.opt .val { min-width: 170px; text-align: center; }
.opt .val::before { content: "◂ "; opacity: 0; } .opt .val::after { content: " ▸"; opacity: 0; }
.opt.on { background: var(--ink); color: var(--paper); } .opt.on .val { color: var(--gold); }
.opt.on .val::before, .opt.on .val::after { opacity: 1; }
.meter { display: inline-block; width: 110px; height: 14px; border: 2px solid currentColor; vertical-align: middle; } .meter i { display: block; height: 100%; background: currentColor; }
</style>
</head>
<body>
<div id="game">
  <div class="book">
    <div class="cover"></div>
    <div class="page l"><h1>Cài đặt</h1><div class="sub">Hình ảnh và điều khiển</div><div id="a" style="margin-top:10px"></div></div>
    <div class="page r"><h2>Âm thanh</h2><div id="b"></div><p class="muted" style="font-size:20px;margin-top:14px">Tỉ lệ hiển thị luôn là số nguyên để pixel sắc nét.</p></div>
  </div>
  <div class="hint">↑ ↓ chọn · ← → đổi · Esc về sổ</div>
</div>
<script src="journal.js"></script>
<script>
const O = [["Toàn màn hình", ["Tắt", "Bật"], 0], ["Tỉ lệ hiển thị", ["Tự động (×1)", "×2", "×3"], 0], ["Số sát thương", ["Ẩn", "Hiện"], 1],
  ["Thanh máu quái", ["Ẩn", "Hiện"], 1], ["Rung màn hình", ["Tắt", "Bật"], 1], ["Hiệu ứng", ["Tối thiểu", "Giảm", "Đầy đủ"], 2],
  ["Nhạc", "%", 60], ["Hiệu ứng âm thanh", "%", 80]];
const val = (o) => o[1] === "%" ? `<span class="meter"><i style="width:${o[2]}%"></i></span> ${o[2]}%` : o[1][o[2]];
const l = Journal.list(() => O.length, (sel) => {
  const row = (o, i) => `<div class="opt ${i === sel ? "on" : ""}"><span>${o[0]}</span><span class="val">${val(o)}</span></div>`;
  document.getElementById("a").innerHTML = O.slice(0, 6).map((o, i) => row(o, i)).join("");
  document.getElementById("b").innerHTML = O.slice(6).map((o, i) => row(o, i + 6)).join("");
});
l.set(0);
addEventListener("keydown", (ev) => {
  const o = O[l.get()];
  if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
  const d = ev.key === "ArrowRight" ? 1 : -1;
  o[2] = o[1] === "%" ? Math.max(0, Math.min(100, o[2] + d * 10)) : (o[2] + d + o[1].length) % o[1].length;
  l.set(l.get());
});
</script>
</body>
</html>
