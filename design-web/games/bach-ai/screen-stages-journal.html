<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn ải (sổ hành trình)</title>
<link rel="stylesheet" href="journal.css">
<style>
#map { position: absolute; left: 30px; top: 110px; }
.mons { display: flex; gap: 10px; margin: 6px 0 10px; }
.mons .sketch { width: 64px; height: 64px; cursor: default; }
.mons img { width: 52px; height: 52px; object-fit: contain; }
.modes { display: flex; gap: 6px; margin: 6px 0; }
.modes span { font-size: 22px; padding: 0 10px; border: 2px solid var(--ink); }
.modes span.on { background: var(--ink); color: var(--paper); }
.modes span.lock { opacity: .45; }
/* proposal 2026-11-26: difficulty on the page + the stage's detail sheet (features the game had before the port) */
.more { float: right; font-size: 20px; color: var(--ink-red); border-bottom: 2px solid var(--ink-red); }
.sheetx { position: absolute; left: 120px; top: 60px; width: 1040px; height: 600px; background: var(--paper); border: 4px solid var(--edge);
  box-shadow: 0 10px 0 #0008; padding: 22px 34px; }
.sheetx::after { content: ""; position: absolute; inset: 10px; border: 2px dashed #b89a6a; pointer-events: none; }
.sheetx h1 { font-size: 40px; } .cols2 { display: flex; gap: 36px; margin-top: 6px; } .cols2 > div { flex: 1; }
.mrow { display: flex; align-items: center; gap: 10px; font-size: 21px; border-bottom: 2px dotted var(--dots); padding: 2px 0; }
.mrow img { width: 40px; height: 40px; object-fit: contain; } .mrow .nm { flex: 1; line-height: 1; } .mrow small { display: block; font-size: 16px; color: var(--ink-soft); }
.mrow .n { width: 62px; text-align: right; }
.trow { display: flex; gap: 12px; font-size: 21px; padding: 1px 0; } .trow b { font-weight: normal; width: 56px; color: var(--ink-soft); }
.dimx { position: absolute; inset: 0; background: #0b0810a0; }
/* redesign 2026-11-26 ("thiết kế lại phần này"): A = the whole spread turns to a lookup spread, B = a pinned slip
   the size of the right page. Both sit exactly on the book, nothing floats at its own size. */
.spreadA { position: absolute; left: 70px; top: 40px; width: 1100px; height: 640px; z-index: 5; }
.spreadA .pg { position: absolute; top: 0; width: 550px; height: 640px; background: var(--paper); border: 4px solid var(--edge); padding: 30px 40px; }
.spreadA .pg::after { content: ""; position: absolute; inset: 12px; border: 2px dashed #b89a6a; pointer-events: none; }
.spreadA .l { left: 0; } .spreadA .r { left: 550px; }
.spreadA h1 { font-size: 40px; } .spreadA h2 { font-size: 28px; }
.mon { display: flex; gap: 12px; align-items: center; border-bottom: 2px dotted var(--dots); padding: 4px 0; }
.mon .pic { width: 52px; height: 52px; border: 3px solid var(--ink); background: #ddcca0; display: grid; place-items: center; flex: none; }
.mon .pic img { width: 44px; height: 44px; object-fit: contain; }
.mon .nm { flex: 1; font-size: 22px; line-height: 1; } .mon .nm small { display: block; font-size: 16px; color: var(--ink-soft); margin-top: 2px; }
.mon .st { font-size: 18px; text-align: right; line-height: 1.1; color: var(--ink-soft); } .mon .st b { font-weight: normal; color: var(--ink); }
.tl { position: relative; margin: 10px 0 0 14px; border-left: 3px solid var(--ink); padding-left: 18px; }
.tl div { position: relative; font-size: 20px; padding: 3px 0; } .tl div::before { content: ""; position: absolute; left: -26px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.tl div.ev::before { background: #3a6aaa; } .tl div.el::before { background: var(--ink-red); } .tl div.boss::before { background: var(--ink-red); width: 14px; height: 14px; left: -28px; }
.tl b { font-weight: normal; color: var(--ink-soft); display: inline-block; width: 56px; }
.slipB { position: absolute; left: 640px; top: 56px; width: 500px; height: 610px; z-index: 5; background: var(--paper); border: 3px solid var(--edge);
  box-shadow: 0 6px 0 #0007; padding: 26px 26px 20px; }
.slipB::before { content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--seal); border: 2px solid #5a0c08; }
.minis { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.mini { width: 140px; border: 3px solid var(--ink); background: #ddcca0; padding: 4px 6px; font-size: 16px; line-height: 1.05; }
.mini img { width: 34px; height: 34px; object-fit: contain; float: left; margin-right: 6px; } .mini b { font-weight: normal; font-size: 17px; display: block; }
</style>
</head>
<body>
<div id="game">
  <div class="book">
    <div class="cover"></div>
    <div class="page l"><h1 id="rname"></h1><div class="sub" id="rsub"></div><canvas id="map" width="480" height="500"></canvas></div>
    <div class="page r" id="right"></div>
    <div class="ribbons" id="tabs"></div>
  </div>
  <div id="over"></div>
  <div class="hint">← → chọn ải · Q / E đổi vùng · ↑ ↓ chế độ · Enter vào trận · Esc về sổ</div>
</div>
<script src="journal.js"></script>
<script>
let ST, MON = {}, SPC = {}, region = 1, stage = 11, mode = 0;
let view = new URLSearchParams(location.search).get("view") || "";   // "detail": the proposal (difficulty + Chi tiết)
const best = 10, COLS = ["#6a8a3a", "#3a5a3a", "#5a6a2a"];
const $ = (id) => document.getElementById(id);
function nodes(r) {   // ten passes on a winding road across the page, the last one the boss
  const out = [];
  for (let k = 0; k < 10; k++) out.push([50 + (k % 5) * 95 + (Math.floor(k / 5) % 2 ? 0 : 0), 80 + Math.floor(k / 5) * 220 + Math.sin(k * 1.3) * 40]);
  return out.map(([x, y], k) => Math.floor(k / 5) % 2 ? [430 - (k % 5) * 95, y] : [x, y]);
}
function draw() {
  const r = ST.regions[region];
  $("rname").textContent = r.name; $("rsub").textContent = `Ải ${r.from}–${r.to} · trùm ở Ải ${r.to}`;
  $("tabs").innerHTML = ST.regions.map((x, i) => `<div class="ribbon ${i === region ? "on" : ""} ${x.from > best + 1 ? "lock" : ""}" title="${x.from > best + 1 ? "Mở khi vượt ải " + (x.from - 1) : ""}" style="background:${COLS[i]}">${x.name}</div>`).join("");
  const c = $("map").getContext("2d"); c.clearRect(0, 0, 480, 500);
  const N = nodes(region);
  c.setLineDash([8, 8]); c.strokeStyle = "#3a2414"; c.lineWidth = 3; c.beginPath(); N.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); c.setLineDash([]);
  N.forEach(([x, y], k) => {
    const n = r.from + k, done = n <= best, open = n <= best + 1, boss = n % ST.boss_every === 0, on = n === stage, s = boss ? 18 : 12;
    c.globalAlpha = open ? 1 : 0.4;
    c.fillStyle = on ? "#3a2414" : done ? "#a0281c" : "#e8d8b0"; c.fillRect(x - s, y - s, s * 2, s * 2);
    c.strokeStyle = on ? "#ffd36b" : "#3a2414"; c.lineWidth = on ? 4 : 3; c.strokeRect(x - s, y - s, s * 2, s * 2);
    c.fillStyle = on ? "#8a2a1a" : "#3a2414"; c.font = "20px VT323"; c.textAlign = "center"; c.fillText(boss ? "Trùm " + n : "Ải " + n, x, y + s + 20);
    c.globalAlpha = 1;
  });
  const boss = stage % ST.boss_every === 0, first = stage > best;
  const gold = ST.rewards.gold_base + ST.rewards.gold_per_stage * stage, gems = first ? (boss ? ST.rewards.gems_boss_first : ST.rewards.gems_first) : ST.rewards.gems_repeat;
  const mons = Object.entries(MON).filter(([k, m]) => !m.boss && !m.gold_drop).slice(region * 3, region * 3 + 4);
  $("right").innerHTML = `<h2>${boss ? "Trùm · " : ""}Ải ${stage}</h2><div class="sub">${stage > best + 1 ? "Chưa mở: qua Ải " + (stage - 1) + " trước" : first ? "Lần đầu: thưởng đá nhiều hơn" : "Đã qua"}</div>
    <div class="modes">${["Thường", "Vô tận", "Thử thách"].map((m, i) => `<span class="${i === mode ? "on" : ""} ${i === 2 && best < 10 ? "lock" : ""}">${m}</span>`).join("")}</div>
    <div class="muted" style="font-size:22px">Quái trong vùng${view ? '<span class="more">Chi tiết ▸ (D)</span>' : ""}</div>
    <div class="mons">${mons.map(([k, m]) => `<div class="sketch"><img src="${Journal.SP}${m.sprite}/${m.sprite}.png"></div>`).join("")}</div>
    <div class="ledger"><span>Thời gian</span><span>05:00</span></div><div class="ledger"><span>Vàng khi thắng</span><span>${gold}</span></div>
    <div class="ledger"><span>Đá</span><span>${gems}</span></div>
    ${view ? `<div class="muted" style="font-size:22px;margin-top:10px">Độ khó so với Ải 1</div>
      <div class="ledger"><span>Máu quái</span><span>×${mul("hp", stage)}</span></div><div class="ledger"><span>Sát thương quái</span><span>×${mul("dmg", stage)}</span></div>
      <div class="ledger"><span>Mật độ quái</span><span>×${mul("rate", stage)}</span></div>` : ""}
    <div class="seal ${stage <= best + 1 ? "on" : ""}" style="right:40px;bottom:30px;width:240px;height:62px;line-height:54px;${stage > best + 1 ? "opacity:.5" : ""}">Vào trận ▶</div>`;
  document.getElementById("over").innerHTML = view === "detail-open" ? sheet() : view === "detail-a" ? sheetA() : view === "detail-b" ? sheetB() : "";
}
// the game's formulas (stages.json _doc): hp 1 + lin m + quad m², damage 1 + lin m, rate min(max, 1 + lin m)
function mul(kind, n) {
  const k = ST.scale, m = n - 1;
  const v = kind === "hp" ? 1 + k.hp_lin * m + k.hp_quad * m * m : kind === "dmg" ? 1 + k.dmg_lin * m : Math.min(k.rate_max, 1 + k.rate_lin * m);
  return v.toFixed(2).replace(".", ",");
}
const EVN = { ring: "Vòng thử thách", collect: "Thu thập sao", hunt: "Săn tinh anh", tornado: "Lốc xoáy", root_snare: "Rễ trói", poison_tide: "Triều độc" };
function sheetData() {
  const r = ST.regions[region], mons = Object.entries(MON).filter(([k, m]) => !m.boss && !m.gold_drop).slice(region * 3, region * 3 + 4);
  const boss = Object.entries(MON).find(([k, m]) => m.boss);
  const all = stage % ST.boss_every === 0 ? mons.concat([boss]) : mons;
  const sp = (m) => { const s = SPC.species[m.species] || {}, e = SPC.elements;
    return [s.name, ...(s.weak || []).map((x) => "yếu " + e[x]), ...(s.resist || []).map((x) => "kháng " + e[x])].filter(Boolean).join(" · "); };
  const marks = mons.slice(1).map(([k, m], i) => [20 + i * 25, m.name + " bắt đầu xuất hiện", ""]).concat(
    (r.events || []).map((e) => [e.t, "Sự kiện: " + (EVN[e.kind] || e.kind), "ev"]), [[40, "3 " + mons[0][1].name + " tinh anh", "el"], [150, "3 " + mons[1][1].name + " tinh anh", "el"]]).sort((a, b) => a[0] - b[0]);
  if (stage % ST.boss_every === 0) marks.push([300, "Trùm: " + boss[1].name, "boss"]);
  const mmss = (t) => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  const k = (x) => parseFloat(mul(x, stage).replace(",", "."));
  return { r, all, sp, marks, mmss, k };
}
function sheetA() {   // A: the whole spread becomes the lookup spread
  const { r, all, sp, marks, mmss, k } = sheetData();
  return `<div class="spreadA"><div class="pg l"><h1>${stage % ST.boss_every === 0 ? "Trùm · " : ""}Ải ${stage}</h1><div class="sub">${r.name} · quái đã tính độ khó</div>
    ${all.map(([id, m]) => `<div class="mon"><div class="pic"><img src="${Journal.SP}${m.sprite}/${m.sprite}.png"></div><div class="nm">${m.name}<small>${sp(m)}</small></div>
      <div class="st">Máu <b>${Math.round(m.hp * k("hp"))}</b><br>ST <b>${Math.round(m.damage * k("dmg"))}</b> · Tốc <b>${m.speed}</b></div></div>`).join("")}</div>
    <div class="pg r"><h2>Mốc thời gian</h2><div class="sub">Trận 05:00</div><div class="tl">${marks.map(([t, x, c]) => `<div class="${c}"><b>${mmss(t)}</b>${x}</div>`).join("")}</div>
      <div class="ledger" style="margin-top:12px"><span>Vàng · Đá lần đầu · sau</span><span>${ST.rewards.gold_base + ST.rewards.gold_per_stage * stage} · ${ST.rewards.gems_first} · ${ST.rewards.gems_repeat}</span></div>
      <div class="muted" style="position:absolute;right:44px;bottom:30px;font-size:20px">D / Esc gấp lại</div></div></div>`;
}
function sheetB() {   // B: a slip pinned over the right page; the map stays in view
  const { r, all, sp, marks, mmss, k } = sheetData();
  return `<div class="slipB"><h2 style="font-size:28px">Chi tiết · Ải ${stage}</h2><div class="sub">${r.name}</div>
    <div class="minis">${all.map(([id, m]) => `<div class="mini" title="${sp(m)}"><img src="${Journal.SP}${m.sprite}/${m.sprite}.png"><b>${m.name}</b>♥${Math.round(m.hp * k("hp"))} ⚔${Math.round(m.damage * k("dmg"))}</div>`).join("")}</div>
    <div class="tl" style="margin-top:4px">${marks.map(([t, x, c]) => `<div class="${c}" style="font-size:18px;padding:1px 0"><b>${mmss(t)}</b>${x}</div>`).join("")}</div>
    <div class="muted" style="position:absolute;right:26px;bottom:14px;font-size:18px">D / Esc đóng</div></div>`;
}
function sheet() {   // the Chi tiết sheet: the stage's monsters (scaled) and its time marks, over the spread
  const r = ST.regions[region], mons = Object.entries(MON).filter(([k, m]) => !m.boss && !m.gold_drop).slice(region * 3, region * 3 + 4);
  const boss = Object.entries(MON).find(([k, m]) => m.boss);
  const all = stage % ST.boss_every === 0 ? mons.concat([boss]) : mons;
  const sp = (m) => { const s = SPC.species[m.species] || {}, e = SPC.elements;
    return [s.name, ...(s.weak || []).map((x) => "yếu " + e[x]), ...(s.resist || []).map((x) => "kháng " + e[x])].filter(Boolean).join(" · "); };
  const marks = mons.slice(1).map(([k, m], i) => [20 + i * 25, m.name + " bắt đầu xuất hiện"]).concat(
    (r.events || []).map((e) => [e.t, "Sự kiện: " + (EVN[e.kind] || e.kind)]), [[40, "3 " + mons[0][1].name + " tinh anh"], [150, "3 " + mons[1][1].name + " tinh anh"]]).sort((a, b) => a[0] - b[0]);
  const mmss = (t) => String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  return `<div class="dimx"></div><div class="sheetx"><h1>${stage % ST.boss_every === 0 ? "Trùm · " : ""}Ải ${stage} · ${r.name}</h1>
    <div class="cols2"><div><div class="muted" style="font-size:22px">Quái của ải (đã tính độ khó)</div>
      <div class="mrow" style="font-size:18px;color:var(--ink-soft)"><span style="width:40px"></span><span class="nm">Tên</span><span class="n">Máu</span><span class="n">ST</span><span class="n">Tốc độ</span></div>
      ${all.map(([k, m]) => `<div class="mrow"><img src="${Journal.SP}${m.sprite}/${m.sprite}.png"><span class="nm">${m.name}<small>${sp(m)}</small></span>
        <span class="n">${Math.round(m.hp * parseFloat(mul("hp", stage).replace(",", ".")))}</span><span class="n">${Math.round(m.damage * parseFloat(mul("dmg", stage).replace(",", ".")))}</span><span class="n">${m.speed}</span></div>`).join("")}</div>
    <div><div class="muted" style="font-size:22px">Mốc thời gian (trận 05:00)</div>
      ${marks.map(([t, x]) => `<div class="trow"><b>${mmss(t)}</b><span style="${x.startsWith("Sự kiện") ? "color:#3a6aaa" : x.includes("tinh anh") ? "color:var(--ink-red)" : ""}">${x}</span></div>`).join("")}
      <div class="ledger" style="margin-top:10px"><span>Vàng / Đá lần đầu / Đá các lần sau</span><span>${ST.rewards.gold_base + ST.rewards.gold_per_stage * stage} / ${ST.rewards.gems_first} / ${ST.rewards.gems_repeat}</span></div></div></div>
    <div class="muted" style="position:absolute;right:40px;bottom:24px;font-size:20px">D / Esc đóng</div></div>`;
}
(async () => {
  [ST, MON, SPC] = await Promise.all([Journal.json("data/stages.json"), Journal.json("data/monsters.json"), Journal.json("data/species.json")]);
  await document.fonts.load("20px VT323");
  delete MON._doc; draw();
})();
addEventListener("keydown", (ev) => {
  const r = ST.regions[region];
  if (ev.key === "ArrowRight") stage = Math.min(r.to, stage + 1); else if (ev.key === "ArrowLeft") stage = Math.max(r.from, stage - 1);
  else if (ev.key === "ArrowDown") mode = (mode + 1) % 3; else if (ev.key === "ArrowUp") mode = (mode + 2) % 3;
  else if (ev.key === "e" || ev.key === "E" || ev.key === "q" || ev.key === "Q") { region = (region + (ev.key.toLowerCase() === "e" ? 1 : ST.regions.length - 1)) % ST.regions.length; stage = ST.regions[region].from; }
  else if ((ev.key === "d" || ev.key === "D") && view) { view = view === "detail-open" ? "detail" : "detail-open"; }
  else if (ev.key === "Escape" && view === "detail-open") { view = "detail"; }
  else if (ev.key === "Enter" && mode === 2) { Journal.go("trials"); return; }
  else if (ev.key === "Enter" && stage <= best + 1) { Journal.go("loading"); return; } else return;
  draw();
});
</script>
</body>
</html>
