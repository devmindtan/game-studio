<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lên cấp · Dải kính</title>
<link rel="stylesheet" href="levelup-base.css">
<style>
/* E "Dải kính" (Hades II boon list, made lighter): three wide translucent bands across the screen; the rarity colour
   floods in from the left; the icon is large and breaks out of the band; the chosen band slides right and opens. */
.veil { background: linear-gradient(90deg, #05060cf2 0 30%, #05060cc8 70%, #05060c90); }
.head { position: absolute; left: 80px; top: 40px; }
.head h1 { font-size: 40px; color: #ffd36b; letter-spacing: 1px; }
.head .sub { font-size: 16px; color: #a8aec4; margin-top: 4px; }
.odds { position: absolute; right: 70px; top: 54px; font-size: 14px; color: #a8aec4; text-align: right; }
.odds i { display: inline-block; width: 22px; height: 6px; margin: 0 6px 2px 14px; }
.list { position: absolute; left: 0; top: 140px; width: 1280px; }
.band { --c: #9aa0b0; position: relative; height: 104px; margin-bottom: 18px; margin-left: 60px; width: 860px; cursor: pointer;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, transparent) 0, #141828d0 28%, #141828a0 80%, transparent);
  border-top: 2px solid color-mix(in srgb, var(--c) 70%, #fff 0%); transition: margin-left 110ms ease-out, height 110ms; }
.band.on { margin-left: 100px; height: 184px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, #141828) 0, color-mix(in srgb, var(--c) 30%, #141828) 24%, #141828e0 70%, transparent); }
.band .ico { position: absolute; left: 22px; top: -14px; width: 116px; height: 116px; display: grid; place-items: center;
  background: #0b0d16; box-shadow: 0 0 0 3px var(--c), 0 6px 0 3px #000c; }
.band .ico img { width: 92px; height: 92px; }
.band .t { position: absolute; left: 166px; top: 14px; }
.band .name { font-size: 30px; font-weight: bold; } .band .name .n { color: #ffffff80; font-size: 20px; margin-right: 8px; }
.band .tag { font-size: 15px; color: #c8cce0; margin-top: 2px; } .band .tag b { color: var(--c); } .band .tag .new { color: #ffd36b; font-weight: bold; }
.band .key { position: absolute; right: 120px; top: 16px; text-align: right; font-size: 15px; color: #c8cce0; }
.band .key .n { font-size: 36px; font-weight: bold; color: #7ee08a; } .band .key .was { font-size: 20px; color: #8a90a8; }
.pips { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }
.pip { width: 16px; height: 5px; background: #ffffff30; } .pip.on { background: #c8cce0; } .pip.new { background: #ffd36b; }
.band .more { position: absolute; left: 166px; right: 120px; top: 84px; font-size: 14px; color: #dde0ee; display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
.band .more .ln { display: flex; justify-content: space-between; } .band .more .mile { color: #ffd36b; }
.build { position: absolute; right: 70px; top: 200px; width: 200px; text-align: center; font-size: 14px; color: #a8aec4; }
.build .ic { display: inline-grid; place-items: center; width: 56px; height: 56px; margin: 8px 4px 0; background: #0b0d16; box-shadow: 0 0 0 2px #3a4060; position: relative; }
.build .ic img { width: 44px; } .build .ic i { position: absolute; right: 3px; bottom: 0; font-style: normal; font-weight: bold; color: #ffd36b; font-size: 14px; }
.keys { position: absolute; left: 80px; bottom: 24px; font-size: 15px; color: #a8aec4; } .keys span { margin-right: 20px; }
</style>
</head>
<body>
<div id="game"><div class="veil"></div>
  <div class="head"><h1>Lên cấp 8</h1><div class="sub">Chọn một kỹ năng mới hoặc nâng cấp</div></div>
  <div class="odds" id="odds"></div>
  <div class="list" id="list"></div>
  <div class="build">ĐANG MANG<br><span id="build"></span></div>
  <div class="keys" id="keys"></div>
</div>
<script src="levelup-data.js"></script>
<script>
odds.innerHTML = LU.odds.map(([n, p, t]) => `<i style="background:${LU.tierCol[t]}"></i>${n} ${p}%`).join("");
build.innerHTML = LU.owned.map(([s, l]) => `<span class="ic"><img src="${s}"><i>${l}</i></span>`).join("");
keys.innerHTML = [`<kbd>↑</kbd> <kbd>↓</kbd> chọn`, `<kbd>Enter</kbd> lấy`, ...LU.actions.map(([k, n, x]) => `<kbd>${k}</kbd> ${n} ${x}`), `<kbd>H</kbd> xem trận`]
  .map((s) => `<span>${s}</span>`).join("");
const paint = (on) => {
  list.innerHTML = LU.cards.map((c, i) => {
    const [kn, a, b] = c.key;
    return `<div class="band${i === on ? " on" : ""}" style="--c:${LU.tierCol[c.tier]}" onmouseenter="go(${i})">
      <div class="ico">${LU.img(c)}</div>
      <div class="t"><div class="name"><span class="n">${i + 1}</span>${c.name}</div>
        <div class="tag"><b>${LU.tierName[c.tier]}</b> · ${c.kind} · ${c.isNew ? '<span class="new">MỚI</span>' : `Cấp ${c.lv[0]} → ${c.lv[1]}`}</div></div>
      <div class="key">${kn}<br><span class="was">${a} → </span><span class="n">${b}</span><div class="pips">${LU.pips(c)}</div></div>
      ${i === on ? `<div class="more"><div>${c.milestone ? `<div class="mile">★ ${c.milestone}</div>` : ""}${c.lines.map(([n, a, b]) =>
        `<div class="ln"><span class="dim">${n}</span><span>${a} → <span class="up">${b}</span></span></div>`).join("")}</div><div>${c.desc}</div></div>` : ""}</div>`;
  }).join("");
};
const go = LU.bind(3, paint, "y");
</script>
</body>
</html>
