<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhân vật: các cuốn sổ</title>
<link rel="stylesheet" href="journal.css">
<style>
.row { display: flex; align-items: center; gap: 14px; padding: 6px 10px; border-bottom: 2px dotted var(--dots); cursor: pointer; }
.row img { width: 64px; height: 64px; }
.row b { font-weight: normal; font-size: 30px; display: block; line-height: 1; }
.row small { font-size: 20px; color: var(--ink-red); }
.row.on { background: var(--ink); color: var(--paper); }
.row.on small { color: var(--gold); }
.row.new { color: var(--ink-red); font-size: 28px; justify-content: center; height: 64px; }
.row.new.on { color: var(--gold); }
.portrait { width: 200px; height: 200px; border: 4px solid var(--edge); background: #d8c498; display: grid; place-items: center; margin: 6px auto 12px; }
.portrait img { width: 176px; height: 176px; }
.cls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.cls .sketch { height: 150px; flex-direction: column; display: flex; align-items: center; justify-content: center; }
.cls .sketch img { width: 96px; height: 96px; }
.cls .sketch b { font-weight: normal; font-size: 24px; }
.cls .sketch.on { color: var(--paper); }
.cls .stamp { position: absolute; top: 40px; color: var(--ink-red); background: #e8d8b0cc; font-size: 20px; }
.nameline { margin-top: 16px; font-size: 26px; border-bottom: 3px solid var(--ink); padding: 0 4px; }
</style>
</head>
<body>
<div id="game">
  <div class="book">
    <div class="cover"></div>
    <div class="page l"><h1>Các cuốn sổ</h1><div class="sub">Mỗi nhân vật một cuốn sổ riêng: túi đồ, tiến độ, vàng, đá</div>
      <div id="rows" style="margin-top:12px"></div></div>
    <div class="page r" id="right"></div>
  </div>
  <div class="hint">↑ ↓ chọn sổ · Enter · Esc về tiêu đề</div>
</div>
<script src="journal.js"></script>
<script>
const SAVES = [["Nhân vật 1", "knight", 10], ["Lam Vân", "mage", 3]];
let CLS = [], UNL = {}, mode = new URLSearchParams(location.search).get("mode") === "create" ? "create" : "list", pick = 0;
const SPRITE = { knight: "knight", mage: "wizard", archer: "bowman", assassin: "assassin" };
const $ = (id) => document.getElementById(id);
function drawRows(sel) {
  $("rows").innerHTML = SAVES.map(([n, c, b], i) => `<div class="row ${i === sel ? "on" : ""}"><img src="${Journal.SP}${SPRITE[c]}/${SPRITE[c]}.png">
    <div><b>${n}</b><small>${CLS.find((x) => x.id === c)?.name || c} · đã qua Ải ${b}</small></div></div>`).join("") +
    `<div class="row new ${sel === SAVES.length ? "on" : ""}">+ Viết sổ mới</div>`;
  mode = sel === SAVES.length ? "create" : "list";
  drawRight(sel);
}
function drawRight(sel) {
  if (mode === "list") {
    const [n, c, b] = SAVES[sel], cd = CLS.find((x) => x.id === c) || {};
    $("right").innerHTML = `<div class="portrait"><img src="${Journal.SP}${SPRITE[c]}/${SPRITE[c]}.png"></div>
      <h1 style="text-align:center">${n}</h1><div class="sub" style="text-align:center">${cd.name} · ${(cd.role || "").toLowerCase()}</div>
      <div class="ledger"><span>Ải cao nhất</span><span>${b}</span></div><div class="ledger"><span>Vàng</span><span>545</span></div>
      <div class="ledger"><span>Đá</span><span>142</span></div><div class="ledger"><span>Nội tại</span><span>${cd.passive?.name || ""}</span></div>
      <div class="seal on" style="right:40px;bottom:30px;width:260px;height:66px;line-height:58px">Dùng sổ này ▶</div>`;
  } else {
    const best = Math.max(...SAVES.map((s) => s[2]));
    $("right").innerHTML = `<h2>Viết sổ mới</h2><div class="sub">Chọn lớp (gắn với nhân vật, không đổi được)</div>
      <div class="cls">${CLS.map((c, i) => { const need = UNL["class_" + c.id] || 0, lock = best < need;
        return `<div class="sketch ${i === pick ? "on" : ""} ${lock ? "lock" : ""}" onclick="pick=${i};drawRight(${sel})"><img src="${Journal.SP}${SPRITE[c.id]}/${SPRITE[c.id]}.png"><b>${c.name}</b>${lock ? `<span class="stamp">Qua ải ${need}</span>` : ""}</div>`; }).join("")}</div>
      <div class="nameline">Tên: <span class="muted">Nhân vật 3</span></div>
      <div class="seal on" style="right:40px;bottom:30px;width:260px;height:66px;line-height:58px">Viết sổ ▶</div>`;
  }
}
(async () => {
  const [c, u] = await Promise.all([Journal.json("data/classes.json"), Journal.json("data/unlocks.json")]);
  CLS = Object.entries(c).filter(([k]) => !k.startsWith("_")).map(([id, v]) => ({ id, ...v })); UNL = u;
  const l = Journal.list(() => SAVES.length + 1, drawRows, (i) => Journal.go("lobby"));
  l.set(mode === "create" ? SAVES.length : 0);
  addEventListener("keydown", (ev) => { if (mode === "create" && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
    pick = (pick + (ev.key === "ArrowRight" ? 1 : CLS.length - 1)) % CLS.length; drawRight(l.get()); } });
})();
</script>
</body>
</html>
