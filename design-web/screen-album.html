<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Album – Bách Ải (thiết kế)</title>
<style>
@font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-display: block; }
:root {
  --ink: #070b10; --panel: #151a24; --panel-2: #1d2330; --gold: #e8c574; --gold-deep: #a8874a;
  --parchment: #f2e6c9; --muted: #b9b29c; --red: #b8443a; --weak: #ff6a78; --resist: #a9a9b8;
}
* { box-sizing: border-box; }
html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; background: #0b1410; }
body { position: relative; color: var(--parchment); font-family: "VT323", monospace; font-size: 22px; line-height: 1;
  -webkit-font-smoothing: none; user-select: none;
  background: radial-gradient(circle at 30% 20%, #16261c 0, #0b1410 70%); }
.px { image-rendering: pixelated; }
h1 { position: absolute; left: 40px; top: 22px; margin: 0; font-size: 46px; color: var(--gold); font-weight: normal; }
#done { position: absolute; left: 44px; top: 70px; font-size: 22px; color: var(--muted); }
#back { position: absolute; right: 40px; top: 26px; width: 180px; height: 42px; border: 3px solid var(--gold-deep);
  background: var(--panel); color: var(--parchment); font: 22px "VT323"; }
/* tabs: a row of plaques; LB / RB switch */
#tabs { position: absolute; left: 40px; top: 110px; display: flex; gap: 8px; }
.tab { width: 150px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel); border: 3px solid #3a3448; color: var(--muted); font-size: 24px; }
.tab.on { border-color: var(--gold); color: var(--gold); background: var(--panel-2); }
.tab small { font-size: 18px; color: var(--muted); }
.lbrb { position: absolute; top: 122px; font-size: 18px; color: var(--muted); }
/* grid */
#grid { position: absolute; left: 40px; top: 172px; width: 668px; display: grid;
  grid-template-columns: repeat(7, 88px); grid-auto-rows: 88px; gap: 8px; }
.cell { position: relative; background: #10161d; border: 3px solid #2e3442; display: flex;
  align-items: center; justify-content: center; }
.cell img { width: 64px; height: 64px; object-fit: contain; }
.cell .ico { width: 48px; height: 48px; background-size: auto 48px; }
.cell.lock img { filter: brightness(0) opacity(.55); }
.cell.lock::after { content: "?"; position: absolute; font-size: 34px; color: #59606e; }
.cell.boss { border-color: #6e5426; }
.cell.sel { border-color: #fff; box-shadow: 0 0 0 3px #e8c574; }
/* detail */
#detail { position: absolute; left: 732px; top: 110px; width: 508px; height: 570px; background: var(--panel);
  border: 3px solid var(--gold-deep); padding: 18px 22px; }
#d-art { height: 150px; display: flex; align-items: center; justify-content: center; background: #0d1218;
  border: 2px solid #2e3442; }
#d-art img { height: 120px; image-rendering: pixelated; }
#d-art .ico { width: 96px; height: 96px; background-size: auto 96px; }
#d-name { margin-top: 14px; font-size: 36px; color: var(--parchment); }
#d-sub { margin-top: 6px; font-size: 22px; color: var(--gold); }
#d-elem { margin-top: 8px; font-size: 20px; }
#d-elem .w { color: var(--weak); } #d-elem .r { color: var(--resist); }
table { margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 22px; }
td { padding: 3px 0; } td:last-child { text-align: right; }
td:first-child { color: var(--muted); }
#d-text { margin-top: 10px; font-size: 20px; line-height: 1.15; color: var(--muted); }
#d-sim { margin-top: 10px; height: 70px; border: 2px dashed #3a3448; display: flex; align-items: center;
  justify-content: center; color: #6c6f7e; font-size: 20px; }
#foot { position: absolute; left: 40px; bottom: 18px; font-size: 20px; color: var(--muted); }
.ico { background-image: url("../games/bach-ai/assets/sprites/custom/card-icons/card-icons_strip.png");
  image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Album</h1>
<div id="done"></div>
<button id="back">Quay lại (Esc)</button>
<div id="tabs"></div>
<div id="grid"></div>
<div id="detail">
  <div id="d-art"></div>
  <div id="d-name"></div>
  <div id="d-sub"></div>
  <div id="d-elem"></div>
  <table id="d-stats"></table>
  <div id="d-text"></div>
  <div id="d-sim"></div>
</div>
<div id="foot">←↑↓→ chọn · Q / E (LB / RB) đổi mục · Esc quay lại</div>
<script>
const SP = "../games/bach-ai/assets/sprites/custom/";
const ICONS = ["blade_arc","whirlwind","earth_strike","ground_slam","cleave_wave","holy_column","dash","earthquake",
  "solar_ray","god_hammer","arcane_bolt","fireball","frost_nova","lightning","thunder_javelin","meteor","void_orb",
  "blizzard","storm"];
const SPECIES = {ooze:["Nhầy",["Lửa"],["Vật lý"]], beast:["Thú",["Vật lý","Bóng tối"],["Băng"]],
  spirit:["Linh hồn",["Ánh sáng","Phép"],["Vật lý","Bóng tối"]], insect:["Côn trùng",["Băng"],["Lửa"]],
  plant:["Thực vật",["Lửa"],["Sét"]], amphibian:["Lưỡng cư",["Sét"],["Lửa"]], goblinoid:["Yêu tinh",[],[]]};
// sample data from the game (monsters.json, upgrades_*.json); seen = killed at least once
const MON = [
  ["slime","Thạch Nhầy","ooze",18,8,42,"Đồng cỏ (ải 1–10)",1], ["bat","Dơi","beast",8,5,95,"Đồng cỏ, Đầm lầy",1],
  ["goblin","Yêu Tinh","goblinoid",34,14,58,"Mọi vùng",1], ["spore","Nấm Phun","plant",22,8,48,"Rừng Âm U",1],
  ["ember-beetle","Bọ Lửa","insect",14,8,92,"Rừng Âm U",0], ["wisp","Ma Trơi","spirit",12,6,105,"Rừng Âm U",1],
  ["wolf","Sói Rừng","beast",30,12,78,"Rừng Âm U",1], ["toad","Cóc Độc","amphibian",28,8,22,"Đầm Lầy Độc",0],
  ["bog-spirit","Hồn Đầm","spirit",30,5,55,"Đầm Lầy Độc",0], ["gold-goblin","Yêu Tinh Vàng","goblinoid",120,0,120,"Mọi vùng (hiếm)",0]];
const BOSS = [["king-slime","Vua Thạch Nhầy","ooze",8000,18,30,"Ải 10",1], ["tree-boss","Mộc Yêu","plant",8500,20,26,"Ải 20",0],
  ["toad-king","Cóc Chúa","amphibian",9500,22,28,"Ải 30",0]];
const SK = [["blade_arc","Chém kiếm","Vật lý","Kiếm sĩ"],["whirlwind","Lốc xoáy","Vật lý","Kiếm sĩ"],
  ["cleave_wave","Sóng kiếm","Vật lý","Kiếm sĩ"],["holy_column","Cột thánh quang","Ánh sáng","Kiếm sĩ"],
  ["solar_ray","Thái dương xạ","Ánh sáng","Kiếm sĩ"],["arcane_bolt","Tia phép","Phép","Pháp sư"],
  ["fireball","Cầu lửa","Lửa","Pháp sư"],["frost_nova","Băng nổ","Băng","Pháp sư"],["storm","Bão sét","Sét","Pháp sư"],
  ["void_orb","Cầu hư không","Bóng tối","Pháp sư"]];
const TABS = [["Quái", MON], ["Boss", BOSS], ["Kỹ năng", SK], ["Vật phẩm", []]];
let tab = 0, sel = 0;
const $ = id => document.getElementById(id);
function icon(id, cls) { const i = ICONS.indexOf(id); return `<div class="ico ${cls||""}" style="background-position:${-i*(cls?96:48)}px 0"></div>`; }
function render() {
  const seenAll = MON.concat(BOSS).filter(m => m[7]).length;
  $("done").textContent = `Đã mở ${seenAll} / ${MON.length + BOSS.length} quái · ${SK.length} kỹ năng`;
  $("tabs").innerHTML = TABS.map((t, i) => `<div class="tab ${i == tab ? "on" : ""}">${t[0]} <small>${t[1].length}</small></div>`).join("");
  const list = TABS[tab][1];
  $("grid").innerHTML = list.map((e, i) => {
    const lock = tab < 2 && !e[7];
    const inner = tab == 2 ? icon(e[0]) : `<img class="px" src="${SP}${e[0]}/${e[0]}.png">`;
    return `<div class="cell ${lock ? "lock" : ""} ${tab == 1 ? "boss" : ""} ${i == sel ? "sel" : ""}">${inner}</div>`;
  }).join("") || `<div style="grid-column: span 7; color: var(--muted); padding-top: 20px">Chưa có vật phẩm.</div>`;
  const e = list[sel];
  if (!e) { ["d-art","d-name","d-sub","d-elem","d-stats","d-text","d-sim"].forEach(k => $(k).innerHTML = ""); return; }
  if (tab < 2) {
    const lock = !e[7]; const sp = SPECIES[e[2]];
    $("d-art").innerHTML = `<img src="${SP}${e[0]}/${e[0]}.png" style="${lock ? "filter: brightness(0) opacity(.5)" : ""}">`;
    $("d-name").textContent = lock ? "???" : e[1];
    $("d-sub").textContent = lock ? "Hạ một lần để mở" : `${sp[0]} · ${e[6]}`;
    $("d-elem").innerHTML = lock ? "" : (sp[1].length ? `<span class="w">Yếu: ${sp[1].join(", ")}</span>   ` : "") +
      (sp[2].length ? `<span class="r">Kháng: ${sp[2].join(", ")}</span>` : "Không yếu, không kháng hệ nào");
    $("d-stats").innerHTML = lock ? "" : `<tr><td>Máu (ải 1)</td><td>${e[3]}</td></tr><tr><td>Sát thương</td><td>${e[4]}</td></tr><tr><td>Tốc độ</td><td>${e[5]}</td></tr>`;
    $("d-text").textContent = lock ? "" : "Đã hạ: 1.240 · Lần đầu gặp: ải 3";
    $("d-sim").textContent = "";
    $("d-sim").style.display = "none";
  } else {
    $("d-art").innerHTML = icon(e[0], "big");
    $("d-name").textContent = e[1];
    $("d-sub").textContent = `${e[3]} · Hệ ${e[2]}`;
    $("d-elem").innerHTML = "";
    $("d-stats").innerHTML = `<tr><td>Sát thương</td><td>×1,3 đòn</td></tr><tr><td>Hồi chiêu</td><td>0,9 s</td></tr>`;
    $("d-text").textContent = "Mỗi cấp +20% sát thương; bậc hình đổi ở mỗi cấp.";
    $("d-sim").style.display = "flex";
    $("d-sim").textContent = "[ mô phỏng chiêu chạy ở đây ]";
  }
}
document.addEventListener("keydown", ev => {
  const n = TABS[tab][1].length, k = ev.key;
  if (k == "ArrowRight") sel = Math.min(n - 1, sel + 1);
  else if (k == "ArrowLeft") sel = Math.max(0, sel - 1);
  else if (k == "ArrowDown") sel = Math.min(n - 1, sel + 7);
  else if (k == "ArrowUp") sel = Math.max(0, sel - 7);
  else if (k == "e" || k == "E") { tab = (tab + 1) % TABS.length; sel = 0; }
  else if (k == "q" || k == "Q") { tab = (tab + TABS.length - 1) % TABS.length; sel = 0; }
  else return;
  ev.preventDefault(); render();
});
const q = new URLSearchParams(location.search);
tab = +(q.get("tab") || 0); sel = +(q.get("sel") || 0);
render();
</script>
</body>
</html>
